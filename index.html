r tonne DS."},"apk":"Sludge dewatering is where TCO is easiest to prove: a cake just 2 points drier can save far more in hauling and hazardous waste (B3) treatment than the polymer costs. If the customer's sludge is classed as B3, work it out in Rp per tonne of cake sent to the licensed processor.","quiz":[{"q":"Solids capture with 5% feed, 20% cake and 0.1% filtrate is about…","o":["80%","100%","98.5%","90%"]},{"q":"Typical detention time of a mesophilic anaerobic digester for good methane production is…","o":["15–30 days","90–120 days","1 hour","1–2 days"]},{"q":"The four belt filter press zones, in order, are…","o":["Conditioning, gravity drainage, wedge (low pressure), high pressure","Gravity, conditioning, high pressure, wedge","Wedge, gravity, conditioning, high pressure","High pressure, wedge, gravity, conditioning"]},{"q":"The sludge that is usually HARDEST to dewater is…","o":["Grit","Sandy primary sludge","Biological sludge (WAS)","Lime softening sludge"]},{"q":"The advantage of a polymer program over ferric chloride plus lime on a filter press is…","o":["Always a drier cake","No jar test needed","More sludge mass","Less sludge mass to dispose of, less corrosion, easier handling"]},{"q":"Belt blinding (plugged belt fabric) can be caused by…","o":["Polymer overdose and/or poor belt washing","Belt speed too low only","Air temperature","Polymer underdose only"]},{"q":"The main adjustable variables on a decanter centrifuge are…","o":["Belt tension","Bowl speed, scroll differential speed, pond depth, feed rate, polymer point","Cloth pore size","Feed rate only"]},{"q":"The most common bench test to select a dewatering polymer is…","o":["SDI test","BOD test","Free drainage test","Turbidity jar test"]}],"essays":["Why is sludge stabilization needed, where is it usually used, and what are its three main methods?","Discuss the two biological methods of sludge stabilization. Explain SLR, SRT, HRT and HLR. What is ATAD?","Why can coagulants and flocculants help in both anaerobic and aerobic digesters?","What does sludge thickening do and what equipment is used? Sketch and label a typical sludge handling system.","Discuss the four classes of gravity sedimentation and the thickening terms: hydraulic loading rate, detention time, sludge volume ratio, sludge loading rate, thickener efficiency.","Sketch a twin belt press; label the belts, polymer feed, conditioning area and the four dewatering zones.","Name three sludge properties that affect a dewatering system and discuss each.","Which mechanical changes are easy to make on a belt press? Which criteria are used to judge its performance?","How does a centrifuge dewater solids, and how is that different from a belt or chamber press? How does a chamber press operate?","What are the pros and cons of drying beds? Compared with ferric chloride and lime on a plate and frame press, what does a polymer program offer?"],"tasks":{"lapangan":["Visit an emulsion breaking account","Visit a heavy metal precipitation account","Visit an odor control account","Run hardness, alkalinity, conductivity and pH tests at two service locations; write and submit service visit reports for both","Run a free drainage test on one customer's sludge with your PT"],"sales":["Discuss with the admin what information is needed to register a new account","Confirm with the admin and your manager when reports are due","Discuss with your manager which accounts you will take over after the program","Prepare next week's proposal presentation; complete the pre-call plan and confirm the appointment","Review odor control, metal precipitation and antifoam opportunities in your area with a senior engineer"],"k3":["Prepare an operator training on safe chemical handling to deliver next week"]},"review":"Your PT reviews Lessons 14–16 and the draft proposal."},{"id":"m8","week":8,"lessons":"Lessons 17–20","title":"Oily Waste, Foam, Odor, Industrial Cleaning & Adding Value","refs":{"teknis":["1.18 Emulsion Treatment","1.19 Foam Control","1.20 Odor Control","1.21 Industrial Cleaning"],"aplikasi":["1.15 Emulsion Treatment","1.16 Foam Control","1.17 Odor Control","1.18 Industrial Cleaning","1.19 Adding Value"]},"figs":["emulsion"],"photos":[["m8-foam","Foam on the surface of an aeration basin"],["m8-cleaning-rig","Chemical circulation cleaning of a heat exchanger with a pump skid and hoses"],["m8-proposal","Engineer presenting a water treatment proposal to a plant team"]],"objectives":["Explain o/w and w/o emulsion stability and how to break emulsions","Apply DAF to oily waste and calculate HLR and HRT","Select and test antifoams (pH, cloud point, feed point, persistence)","Explain the sulfur chemistry of odor and the eight odor control methods","Choose cleaner types and cleaning methods","Build restorative, opportunistic and preventive value into a proposal"],"summary":[{"h":"Emulsions","list":["o/w (oil-in-water): water is the continuous phase; looks grey and dirty. This is oily wastewater. w/o (water-in-oil): oil is continuous; black and viscous. This is waste oil or slop.","Stabilizers: ionization (droplet charge, double layer), adsorption (surfactants or fine solids at the interface), frictional contact (pumping and mixing make fine droplets).","Breaking o/w: neutralize the charge (cationic demulsifier, inorganic coagulant, acid/pH), then flocculate and float (DAF/IAF). Remove free oil first in an API or CPI.","w/o (waste oil): treatment by transfer, pH adjustment, internal mixing, chemical treatment; usually batch, with heat plus demulsifier."]},{"h":"Foam control","list":["Foam is gas dispersed in a liquid and stabilized by impurities (surfactants, proteins, filamentous biomass).","An antifoam spreads into the bubble film, displaces the stabilizers and thins the film until it breaks.","Selection: lab recirculation testing with the real liquid, then a plant trial to set dose, feed method and cost.","pH affects performance; cloud point matters for bulk storage (the product can separate or haze at some temperatures); the feed point must be ahead of foam formation or in a turbulent zone; persistence is how long the effect lasts, which drives cost."]},{"h":"Odor control","list":["Odors come mostly from anaerobic decomposition: H₂S, mercaptans, amines, volatile acids. H₂S is toxic and corrosive (biogenic sulfuric acid attacks concrete).","Objectives: (1) worker safety, the most important; (2) preventing community complaints; (3) preventing corrosion.","Methods: aeration/biological oxidation, oxidants (NaOCl, H₂O₂, KMnO₄), iron salts (precipitate FeS), nitrate (prevents sulfide formation), pH increase (NaOH, Mg(OH)₂), masking/counteractants, scrubbers or biofilters, covers and ventilation."]},{"h":"Industrial cleaning","list":["Acid cleaners: mineral scale (CaCO₃), rust and iron oxides; HCl, citric, sulfamic, phosphoric acids, always with a corrosion inhibitor.","Alkaline cleaners: oil, grease, organics, biological deposits; inexpensive.","Emulsifiable solvents: heavy oil or asphaltic deposits that alkaline cleaners can't handle, or alkali-sensitive metals.","Methods: immersion, spray, circulation (heat exchangers, pipework), steam cleaning, fill and soak, foam/gel; often with mechanical action.","Always: identify the deposit first (analysis), check metallurgy compatibility, use an inhibitor, and plan neutralization and disposal of spent solution and safety."]},{"h":"Building value into the proposal","list":["Restorative: bringing performance back to the original spec (dewatering has declined, effluent is out of compliance).","Opportunistic: reaching a new performance level (drier cake, more plant capacity, water reuse).","Preventive: avoiding a problem (fines, shutdowns, corrosion, complaints).","Quantify what the customer cares about in their own units (Rp, tonnes of cake, m³ of water, hours of downtime) and validate it with them."]}],"formulas":[{"n":"DAF HLR (with recycle)","f":"HLR = Q × (1 + R) / A"},{"n":"DAF HRT","f":"HRT = Volume / [Q × (1 + R)]"}],"example":{"h":"Worked example: DAF on oily waste","p":"DAF 3.66 m in diameter, 4.57 m deep, 34.08 m³/h influent, 50% recycle: HLR ≈ 4.9 m/h and HRT ≈ 56 minutes. During an upset the influent rises to 45.4 m³/h: HLR ≈ 6.5 m/h, HRT ≈ 42 minutes, A/S drops and oil slips through. Expect to raise air/recycle and adjust the demulsifier and polymer dose."},"apk":"APK's HCl is the main acid cleaner for scale and rust; NaOH serves alkaline cleaning and raises pH for H₂S control; NaOCl is an odor oxidant. For boiler and cooling tower chemical cleaning, draw on APK's track record (boiler chemical cleaning and passivation).","quiz":[{"q":"Oily waste that looks grey and dirty is usually which emulsion?","o":["Solid emulsion","w/o (water-in-oil)","Not an emulsion","o/w (oil-in-water)"]},{"q":"The three mechanisms that stabilize emulsions are…","o":["Oxidation, reduction, hydrolysis","Temperature, pressure, color","pH, TDS, turbidity","Ionization, adsorption, frictional contact"]},{"q":"The MOST important objective of odor control is…","o":["Lowering TDS","Aesthetics","Worker safety (H₂S is toxic)","Saving water"]},{"q":"Why does antifoam cloud point matter for bulk storage?","o":["It doesn't matter","It sets the price","It sets the product color","The product can separate or haze at certain temperatures, so the dose isn't uniform"]},{"q":"Acid cleaners are mainly used to remove…","o":["Mineral scale and iron oxides","Paint","Biological deposits only","Oil and grease"]},{"q":"When should an emulsifiable solvent cleaner be considered even though it costs more than alkaline?","o":["Always","For CaCO₃ scale","For heavy oil or asphaltic deposits that alkaline won't remove, or alkali-sensitive metals","For rust"]},{"q":"Bringing a wastewater plant back to its design performance is which kind of value?","o":["Restorative","Opportunistic","Strategic","Preventive"]},{"q":"After an antifoam passes the lab recirculation test, the next step is…","o":["Sign a contract immediately","Nothing","A plant trial to set dose, feed method and cost data","Switch products"]},{"q":"Iron salts are used in odor control because they…","o":["Add oxygen","Lower temperature","Kill all bacteria","Bind sulfide as non-volatile FeS"]}],"essays":["Explain how ionization, adsorption and frictional contact stabilize o/w emulsions. How is the double layer dealt with?","How are API and CPI separators alike and how do they differ? How is a DAF used on oily wastewater?","A DAF is 3.66 m in diameter with 34.08 m³/h flow and 50% recycle: calculate the HLR. At 4.57 m deep, calculate the HRT. If flow rises to 45.4 m³/h, how will performance change and what changes in air and polymer would you expect?","Discuss the three methods for treating water-in-oil (waste oil) emulsions.","What makes foam stable and how does an antifoam counter it? How do pH, cloud point, feed point and persistence affect antifoam selection?","What is ‘odor’ in this context, where does it come from, and what are the three main objectives of odor control? Discuss the role of sulfur chemistry.","List the eight common odor control methods with the pros and cons of each.","Which deposits do acid and alkaline cleaners usually remove? List the eight cleaner types and the six cleaning methods.","Take one of your prospects: describe the restorative, opportunistic and preventive value APK can offer, with numbers."],"tasks":{"lapangan":["Prepare your full PAC 1 (liquid-solids separation) sales toolbox for PT review","Prepare the customer program book for the account you won or proposed to"],"sales":["Prepare contract renewal documents for a customer whose contract ends within 3 months","Build the proposal and presentation (dewatering, metal precipitation or antifoam); anticipate the customer's objections","List the reasons the prospect should switch to APK, and the reasons they might stay with their current supplier","Present the proposal to your PT and manager (week 7), then present the revised version to the real prospect (week 8)","Make sales calls on your own","Schedule the oral competency exam with your manager and PT within 3 weeks"],"k3":["Deliver the safe chemical handling training to customer operators","Your manager does a second commentary drive","Learn the procedure for shipping samples safely (packaging, labels, documents)"]},"review":"To complete the program: every module quiz at 70% or more, final exam at 70% or more, proposal presented, and the oral exam with your manager and PT."}],"glossary":[["A/S ratio","Air-to-solids ratio in a DAF: mass of air released per mass of solids"],["APHA","Platinum-cobalt color unit"],["BOD₅ / COD","5-day biochemical oxygen demand / chemical oxygen demand"],["Bridging","How high molecular weight flocculants tie several particles together"],["Charge reversal","Particles turn positive after a coagulant overdose and disperse again"],["DAF / IAF","Dissolved / induced air flotation"],["DT / HRT","Detention time / hydraulic retention time = volume ÷ flow"],["F/M","Food-to-microorganism ratio (kg BOD per kg MLSS per day)"],["G factor","Velocity gradient, a measure of mixing intensity (s⁻¹)"],["Jar test","Bench simulation of coagulation, flocculation and settling on a gang stirrer"],["MCRT / SRT","Mean cell retention time / sludge age"],["MLSS","Mixed liquor suspended solids in the aeration basin"],["MOC","Mechanical–Operational–Chemical survey model"],["NTU / FTU","Turbidity units (nephelometric / formazin)"],["ORP","Oxidation-reduction potential (mV)"],["P & M alkalinity","Phenolphthalein (pH 8.3) and methyl orange/total (pH 4.3) alkalinity"],["PACl","Polyaluminium chloride (coagulant)"],["PT","Primary Trainer, the trainee's day-to-day coach"],["RAS / WAS","Return / waste activated sludge"],["SRR","Surface rise rate = flow ÷ surface area"],["SVI","Sludge volume index (mL/g)"],["TCO","Total Cost of Operation"],["VSR","Volatile solids reduction in a digester"],["WOR","Weir overflow rate = flow ÷ weir length"]]};
// Technical diagrams for LMS PAC 1, drawn as SVG so labels stay accurate.
const FIGS = (function(){
  let uid = 0;
  const T = (x,y,s,cls="",anchor="middle") => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="fx ${cls}">${s}</text>`;
  const box = (x,y,w,h,lines,cls="fb") => {
    const L = [].concat(lines); const cy = y + h/2 - (L.length-1)*7 + 4;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" class="${cls}"/>` + L.map((l,i)=>T(x+w/2, cy+i*14, l, i?"fs":"fb-t")).join("");
  };
  const svg = (w,h,body,label) => { const id = "ah"+(++uid);
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fah"/></marker></defs>
      ${body.replace(/MARK/g, id)}</svg>`; };
  const ar = (x1,y1,x2,y2,cls="fl") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" marker-end="url(#MARK)"/>`;
  const pa = (d,cls="fl",mk=true) => `<path d="${d}" class="${cls}" fill="none" ${mk?'marker-end="url(#MARK)"':""}/>`;

  const F = {};

  // 1. Process flow
  F.flow = { t: "The liquid-solids separation chain", c: "Raw water and wastewater trains both end in sludge. Every step upstream changes how much sludge there is and how easily it dewaters.",
    svg: (()=>{ let b="";
      const row=(y,items,cls)=>{ const w=118,g=22; items.forEach((it,i)=>{ const x=20+i*(w+g); b+=box(x,y,w,46,it,cls); if(i<items.length-1) b+=ar(x+w,y+23,x+w+g,y+23); }); };
      b+=T(20,24,"RAW WATER","fk","start");
      row(32,[["Intake","screen"],["Pretreatment","oxidation, pH"],["Clarification","coag · floc · settle"],["Filtration","media / UF"],["To use","cooling / boiler"]],"fw");
      b+=T(20,124,"WASTEWATER","fk","start");
      row(132,[["Pretreatment","screen · grit · EQ"],["Primary","clarifier · API · DAF"],["Secondary","biological"],["Tertiary / AWT","P, NH₃, metals, UV"],["Discharge","or reuse"]],"fb");
      b+=T(20,224,"SLUDGE","fk","start");
      row(232,[["Stabilization","digestion"],["Thickening","gravity · DAF · drum"],["Dewatering","belt · decanter"],["Disposal","landfill / B3"]],"fsl");
      b+=ar(219,178,219,230,"fl fd")+ar(359,178,299,230,"fl fd")+T(440,226,"+ clarifier & filter backwash sludge","fs","start");
      return svg(720,290,b,"Process flow from raw water and wastewater to sludge"); })() };

  // 2. Alkalinity species vs pH
  F.alk = { t: "Carbonate species vs pH", c: "Below pH 8.3 (P end point) there is no carbonate; below pH 4.3 (M end point) all alkalinity has become CO₂. Hydroxide only matters above about pH 10.",
    svg: (()=>{ const X=p=>60+(p-4)*72, Y=f=>230-f*190; const K1=Math.pow(10,-6.35),K2=Math.pow(10,-10.33);
      const pts={a0:[],a1:[],a2:[]}; for(let p=4;p<=12.001;p+=0.1){const H=Math.pow(10,-p),d=H*H+K1*H+K1*K2; pts.a0.push([X(p),Y(H*H/d)]);pts.a1.push([X(p),Y(K1*H/d)]);pts.a2.push([X(p),Y(K1*K2/d)]);}
      const line=a=>"M"+a.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" L");
      let b=`<rect x="60" y="40" width="576" height="190" class="fgrid"/>`;
      for(let p=4;p<=12;p++){ b+=`<line x1="${X(p)}" y1="40" x2="${X(p)}" y2="230" class="fgl"/>`+T(X(p),248,p,"fs"); }
      [0,0.5,1].forEach(f=>{ b+=T(52,Y(f)+4,f*100+"%","fs","end"); });
      b+=`<line x1="${X(4.3)}" y1="34" x2="${X(4.3)}" y2="230" class="fmk"/>`+T(X(4.3),28,"M end point 4.3","fs");
      b+=`<line x1="${X(8.3)}" y1="34" x2="${X(8.3)}" y2="230" class="fmk"/>`+T(X(8.3),28,"P end point 8.3","fs");
      b+=pa(line(pts.a0),"fc1",false)+pa(line(pts.a1),"fc2",false)+pa(line(pts.a2),"fc3",false);
      b+=T(X(5),Y(0.62),"CO₂ (H₂CO₃)","fs fc1t")+T(X(8.3),Y(0.72),"HCO₃⁻","fs fc2t")+T(X(11.5),Y(0.6),"CO₃²⁻","fs fc3t");
      b+=T(348,272,"pH","fs");
      return svg(680,280,b,"Fraction of CO2, bicarbonate and carbonate versus pH"); })() };

  // 3. Coagulation & flocculation
  F.coag = { t: "Stable colloids → coagulation → flocculation", c: "Negative colloids repel each other. A cationic coagulant neutralizes the charge; a high molecular weight flocculant then bridges the small agglomerates into a settleable floc.",
    svg: (()=>{ let b=""; const col=(cx,cy,r=13,neg=true)=>`<circle cx="${cx}" cy="${cy}" r="${r}" class="fcol"/>`+(neg?T(cx,cy+4,"−","fb-t"):"");
      const P1=[[60,70],[120,55],[95,120],[160,110],[55,150],[140,165]]; P1.forEach(p=>b+=col(p[0],p[1]));
      b+=T(110,215,"1 · Stable colloids","fb-t")+T(110,232,"same charge, repel","fs");
      b+=ar(200,110,240,110);
      const P2=[[290,80],[310,95],[296,112],[360,120],[377,132],[355,140],[300,165],[318,170]]; P2.forEach(p=>b+=col(p[0],p[1],11,false));
      [[303,60],[340,92],[385,110],[285,140],[340,165],[372,160]].forEach(p=>b+=T(p[0],p[1],"+","fc2t fb-t"));
      b+=T(330,215,"2 · Coagulation","fb-t")+T(330,232,"charge neutralized, pin floc","fs");
      b+=ar(420,110,460,110);
      const P3=[[505,70],[522,82],[508,96],[570,92],[586,104],[540,130],[556,142],[600,150],[615,162],[520,165],[536,176]]; P3.forEach(p=>b+=col(p[0],p[1],10,false));
      b+=pa("M492 60 C 540 40, 600 80, 588 110 S 520 120, 545 150 S 640 140, 612 175 S 500 190, 515 160","fpoly",false);
      b+=T(560,215,"3 · Flocculation","fb-t")+T(560,232,"polymer bridges → large floc","fs");
      return svg(680,245,b,"Coagulation and flocculation steps"); })() };

  // 4. Jar test dose curve
  F.jar = { t: "Jar test: turbidity vs dose", c: "Settled turbidity falls to an optimum, then rises again on overdose (charge reversal). Organic coagulants can show a second, false minimum, so always test a wide range first.",
    svg: (()=>{ let b=`<rect x="60" y="30" width="560" height="190" class="fgrid"/>`;
      for(let i=0;i<=5;i++){ b+=`<line x1="${60+i*112}" y1="30" x2="${60+i*112}" y2="220" class="fgl"/>`; }
      b+=pa("M70 50 C 140 60, 180 190, 240 196 C 280 200, 300 150, 340 140 C 380 132, 400 172, 440 176 C 500 182, 560 90, 610 60","fc1",false);
      b+=`<circle cx="240" cy="196" r="5" class="fdot"/>`+T(240,186,"optimum","fs");
      b+=`<circle cx="440" cy="176" r="5" class="fdot2"/>`+T(440,166,"false minimum","fs");
      b+=T(540,100,"overdose","fs","end")+T(130,44,"underdose","fs");
      b+=T(340,245,"Coagulant dose (mg/L) →","fs")+`<text x="24" y="125" class="fx fs" transform="rotate(-90 24 125)" text-anchor="middle">Settled turbidity (NTU) →</text>`;
      return svg(660,258,b,"Dose response curve with optimum and false minimum"); })() };

  // 5. Sedimentation zones
  F.sedzones = { t: "Zones of a rectangular settling basin", c: "A particle entering at two-thirds of the inlet height is captured only if it reaches the sludge zone before the outlet zone. Higher flow flattens its path.",
    svg: (()=>{ let b=`<rect x="40" y="40" width="600" height="150" class="fw"/>`;
      b+=`<rect x="40" y="40" width="90" height="150" class="fz1"/><rect x="550" y="40" width="90" height="150" class="fz1"/><rect x="130" y="160" width="420" height="30" class="fsl"/>`;
      b+=T(85,120,"Inlet","fb-t")+T(85,134,"zone","fs")+T(595,120,"Outlet","fb-t")+T(595,134,"zone","fs")+T(340,90,"Settling zone","fb-t")+T(340,180,"Sludge zone","fb-t");
      b+=ar(10,90,40,90)+ar(640,60,672,60);
      b+=pa("M130 90 Q 330 110 520 160","fc3",true); b+=`<circle cx="130" cy="90" r="4" class="fdot"/>`;
      b+=pa("M130 90 Q 400 100 560 130","fd fl",true); b+=T(470,140,"at higher flow","fs");
      b+=T(130,80,"particle at ⅔ height","fs","start");
      return svg(690,210,b,"Settling basin with inlet, settling, sludge and outlet zones"); })() };

  // 6. Solids-contact clarifier
  F.solidscontact = { t: "Solids-contact clarifier (internal sludge recirculation)", c: "The turbine lifts settled sludge back into the reaction zone, so incoming water meets a high concentration of floc. That sludge inventory is what makes the unit work.",
    svg: (()=>{ let b=`<path d="M40 40 L640 40 L640 170 L420 230 L260 230 L40 170 Z" class="fw"/>`;
      b+=`<path d="M250 40 L250 120 L200 175 L480 175 L430 120 L430 40" class="fz1" />`;
      b+=`<path d="M60 170 L260 222 L420 222 L620 170 L620 190 L420 230 L260 230 L60 190 Z" class="fsl"/>`;
      b+=`<rect x="320" y="20" width="40" height="18" class="fb"/><line x1="340" y1="38" x2="340" y2="150" class="fl"/><rect x="315" y="145" width="50" height="10" class="fb"/>`;
      b+=T(340,82,"Reaction /","fb-t")+T(340,96,"mixing zone","fs");
      b+=T(130,80,"Clarification","fb-t")+T(130,94,"zone","fs")+T(550,80,"Clarification","fb-t")+T(550,94,"zone","fs");
      b+=T(340,212,"Sludge bed","fb-t")+T(340,16,"drive","fs");
      b+=pa("M230 190 C 200 160, 220 130, 270 130","fc2",true)+pa("M450 190 C 480 160, 460 130, 410 130","fc2",true);
      b+=pa("M180 120 L180 52","fc1",true)+pa("M500 120 L500 52","fc1",true)+T(186,112,"to launder","fs","start");
      b+=ar(4,60,250,60)+T(10,54,"raw water + coagulant","fs","start");
      b+=ar(340,230,340,256)+T(350,252,"sludge blowdown","fs","start");
      return svg(680,262,b,"Cross-section of a solids contact clarifier"); })() };

  // 7. Multimedia filter
  F.filter = { t: "Multimedia filter bed", c: "Coarse, light media on top and fine, heavy media below, so solids penetrate the whole depth. Backwash lifts and cleans the bed.",
    svg: (()=>{ let b=`<rect x="200" y="20" width="220" height="250" rx="8" class="fb"/>`;
      b+=`<rect x="205" y="30" width="210" height="50" class="fw"/>`+T(310,60,"water + floc","fs");
      [["Anthracite","0.9–1.1 mm","fm1",80,60],["Sand","0.45–0.55 mm","fm2",140,45],["Garnet","0.2–0.3 mm","fm3",185,30],["Gravel support","","fm4",215,30]].forEach(([n,s,c,y,h])=>{ b+=`<rect x="205" y="${y}" width="210" height="${h}" class="${c}"/>`+T(310,y+h/2+4,n+(s?" · "+s:""),(c==="fm1"||c==="fm3")?"fs fwhite":"fs"); });
      b+=`<rect x="205" y="245" width="210" height="20" class="fz1"/>`+T(310,259,"underdrain","fs");
      b+=ar(150,40,200,40)+T(146,36,"influent","fs","end")+ar(420,255,480,255)+T(484,259,"filtrate","fs","start");
      b+=pa("M520 250 L520 60","fc2",true)+T(530,150,"backwash","fs","start")+T(530,164,"(up-flow, + air scour)","fs","start");
      b+=pa("M100 80 L100 230","fc1",true)+T(90,160,"service","fs","end")+T(90,174,"(down-flow)","fs","end");
      return svg(640,280,b,"Layers of a multimedia filter"); })() };

  // 8. DAF
  F.daf = { t: "Dissolved air flotation (DAF)", c: "Part of the clarified effluent is pressurized with air and released into the inlet. Micro-bubbles attach to the floc and float it to the surface, where a skimmer removes it.",
    svg: (()=>{ let b=`<rect x="160" y="60" width="380" height="140" class="fw"/><rect x="160" y="60" width="380" height="26" class="fsl"/>`+T(350,78,"float (sludge + oil)","fs");
      for(let i=0;i<34;i++){ const x=200+((i*53)%300), y=100+((i*37)%90); b+=`<circle cx="${x}" cy="${y}" r="${2+i%3}" class="fbub"/>`; }
      b+=ar(30,170,160,170)+T(30,148,"influent +","fs","start")+T(30,162,"coagulant, polymer","fs","start");
      b+=`<rect x="250" y="40" width="120" height="14" class="fb"/>`+T(310,34,"skimmer →","fs")+ar(540,72,640,72)+T(600,66,"float","fs");
      b+=ar(540,185,640,185)+T(600,180,"effluent","fs");
      b+=`<rect x="440" y="225" width="90" height="40" rx="8" class="fb"/>`+T(485,242,"saturation","fs")+T(485,256,"tank 4–6 bar","fs");
      b+=pa("M600 185 L600 245 L530 245","fc2",true)+T(608,220,"recycle","fs","start");
      b+=pa("M440 245 L180 245 L180 185","fc2",true)+T(300,262,"pressurized recycle → micro-bubbles","fs");
      b+=ar(485,290,485,266)+T(495,288,"air","fs","start");
      return svg(680,300,b,"Dissolved air flotation unit with recycle pressurization"); })() };

  // 9. Activated sludge
  F.as = { t: "Activated sludge process", c: "Biomass in the aeration basin consumes BOD; the clarifier separates it. Return sludge (RAS) keeps MLSS up; waste sludge (WAS) sets the sludge age.",
    svg: (()=>{ let b=box(20,80,110,50,["Primary","effluent"],"fb")+ar(130,105,180,105);
      b+=`<rect x="180" y="60" width="200" height="100" class="fw"/>`+T(280,98,"Aeration basin","fb-t")+T(280,114,"MLSS · DO 1–3 mg/L","fs");
      for(let i=0;i<8;i++) b+=`<circle cx="${198+i*24}" cy="${150-(i%3)*8}" r="3" class="fbub"/>`;
      b+=ar(380,105,430,105)+`<path d="M430 60 L570 60 L570 130 L520 165 L480 165 L430 130 Z" class="fw"/>`+T(500,98,"Secondary","fb-t")+T(500,112,"clarifier","fs");
      b+=ar(570,80,650,80)+T(612,72,"effluent","fs");
      b+=pa("M500 165 L500 210 L280 210 L280 160","fc2",true)+T(390,226,"RAS (return activated sludge)","fs");
      b+=ar(500,210,650,210,"fc3")+T(612,202,"WAS","fs");
      b+=ar(280,30,280,60)+T(290,30,"air","fs","start");
      return svg(680,240,b,"Activated sludge with RAS and WAS"); })() };

  // 10. Metals
  F.metals = { t: "Metal finishing wastewater: typical treatment sequence", c: "Chromium and cyanide streams are pretreated separately before the combined stream is precipitated. Never let a cyanide stream meet acid.",
    svg: (()=>{ let b="";
      b+=box(10,20,110,46,["Chrome rinse","Cr⁶⁺"],"fb")+ar(120,43,150,43)+box(150,20,150,46,["Reduction","pH 2–3 · bisulfite"],"fw")+T(225,82,"ORP control","fs");
      b+=box(10,110,110,46,["Cyanide rinse","CN⁻"],"fb")+ar(120,133,150,133)+box(150,110,150,46,["Stage 1","NaOCl · pH ≥ 10"],"fw")+ar(300,133,330,133)+box(330,110,140,46,["Stage 2","NaOCl · pH 8–8.5"],"fw");
      b+=box(10,200,110,46,["Acid/alkali","rinses"],"fb");
      b+=pa("M300 43 L520 43 L520 140","fl",true)+pa("M470 133 L505 150","fl",true)+pa("M120 223 L500 223 L515 175","fl",true);
      b+=box(480,140,120,46,["Precipitation","NaOH · pH 8–9"],"fw")+ar(600,163,620,163);
      b+=box(620,140,100,46,["Floc +","clarifier"],"fw")+ar(670,186,670,215)+box(620,215,100,40,["Filter press"],"fsl");
      return svg(730,262,b,"Chromium reduction and cyanide destruction ahead of metal precipitation"); })() };

  // 11. Belt press
  F.beltpress = { t: "Belt filter press: four zones", c: "Floc must be strong enough to survive each step. Most problems show up first in the gravity zone (poor drainage) or as cake squeezing out at the belt edges.",
    svg: (()=>{ let b="";
      b+=`<rect x="20" y="60" width="90" height="50" class="fw"/>`+T(65,82,"1 · Conditioning","fs")+T(65,96,"polymer + mix","fs");
      b+=ar(110,85,140,85);
      b+=`<line x1="140" y1="100" x2="360" y2="100" class="fbelt"/>`+`<rect x="140" y="88" width="220" height="12" class="fsl"/>`+T(250,80,"2 · Gravity drainage","fb-t");
      for(let i=0;i<6;i++) b+=ar(170+i*35,104,170+i*35,124,"fc2");
      b+=`<line x1="360" y1="100" x2="470" y2="140" class="fbelt"/><line x1="360" y1="80" x2="470" y2="128" class="fbelt"/>`+T(410,58,"3 · Wedge","fb-t")+T(410,72,"low pressure","fs");
      [500,550,600].forEach((x,i)=>{ b+=`<circle cx="${x}" cy="${i%2?150:126}" r="${18-i*2}" class="froll"/>`; });
      b+=`<path d="M470 134 Q 500 106, 525 140 Q 550 168, 575 130 Q 600 100, 640 134" class="fbelt" fill="none"/>`+T(560,192,"4 · High pressure / shear","fb-t");
      b+=ar(640,134,690,134)+T(672,126,"cake","fs");
      b+=T(250,150,"filtrate","fs");
      return svg(700,205,b,"Belt filter press zones"); })() };

  // 12. Emulsions
  F.emulsion = { t: "Oil-in-water vs water-in-oil", c: "In o/w the droplets are oil and water is continuous (oily wastewater). In w/o the droplets are water and oil is continuous (waste oil, slop). Surfactant at the interface keeps them apart.",
    svg: (()=>{ let b=`<rect x="20" y="20" width="300" height="180" rx="10" class="fw"/><rect x="360" y="20" width="300" height="180" rx="10" class="foil"/>`;
      const drops=(ox,cls)=>{ [[60,60],[120,90],[200,55],[250,120],[90,150],[170,150],[240,170],[150,40]].forEach(([x,y],i)=>{ const r=10+i%3*4; b+=`<circle cx="${ox+x}" cy="${y+10}" r="${r}" class="${cls}"/>`; for(let k=0;k<6;k++){ const a=k*Math.PI/3; b+=`<line x1="${ox+x+Math.cos(a)*r}" y1="${y+10+Math.sin(a)*r}" x2="${ox+x+Math.cos(a)*(r+6)}" y2="${y+10+Math.sin(a)*(r+6)}" class="fsurf"/>`; } }); };
      drops(0,"fdrop-oil"); drops(340,"fdrop-w");
      b+=T(170,222,"o/w — oil droplets in water","fb-t")+T(510,222,"w/o — water droplets in oil","fb-t");
      return svg(680,236,b,"Oil in water and water in oil emulsions"); })() };

  return F;
})();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMS PAC 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: week rail on the left (water → sludge order), module content on the right. */
  --bg:#f3f6f7; --surface:#ffffff; --ink:#13283a; --muted:#5b6b78; --line:#d8e1e6;
  --accent:#0e7c86; --accent-ink:#ffffff; --accent-soft:#e2f2f3;
  --sediment:#a8681a; --sediment-soft:#f7ecdc;
  --good:#1f7a43; --good-soft:#e3f3e9; --warn:#a26300; --warn-soft:#fbf0dc; --bad:#b4332b; --bad-soft:#fae6e4;
  --f-display:"Archivo","Segoe UI",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1820; --surface:#13222c; --ink:#e3ecf1; --muted:#9db0bd; --line:#24384a;
  --accent:#3fb6bf; --accent-ink:#06222a; --accent-soft:#16343c;
  --sediment:#e0a656; --sediment-soft:#33291a;
  --good:#5cc98a; --good-soft:#163222; --warn:#e7b25a; --warn-soft:#352914; --bad:#ef7d74; --bad-soft:#3a1d1b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1820; --surface:#13222c; --ink:#e3ecf1; --muted:#9db0bd; --line:#24384a;
  --accent:#3fb6bf; --accent-ink:#06222a; --accent-soft:#16343c;
  --sediment:#e0a656; --sediment-soft:#33291a;
  --good:#5cc98a; --good-soft:#163222; --warn:#e7b25a; --warn-soft:#352914; --bad:#ef7d74; --bad-soft:#3a1d1b; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
:root[data-theme="dark"] .top{background:#081117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#081117}}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:38px;height:38px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;font-size:.95rem}
.brand small{display:block;color:#a9c4cf;font-size:.8rem}
.brand b{font-family:var(--f-display);font-size:1.05rem}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{background:transparent;border:1px solid #2f4a5d;color:#d7e6ec;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem}
nav.tabs button[aria-current="true"]{background:#fff;color:#13283a;border-color:#fff}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;padding:20px 16px 60px}
@media (max-width:860px){.shell{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:6px}
.rail h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 2px 6px}
.wk{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;cursor:pointer}
.wk:hover{border-color:var(--accent)}
.wk[aria-current="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.wk .n{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.1rem;text-align:center}
.wk .t{font-size:.88rem;font-weight:600;line-height:1.25}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.done i{background:var(--good)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card>*+*{margin-top:10px}
.lead{color:var(--muted);max-width:68ch}
.notice{border-left:4px solid var(--sediment);background:var(--sediment-soft);padding:10px 14px;border-radius:6px;font-size:.92rem}
.notice.ok{border-color:var(--good);background:var(--good-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.flow span{background:var(--accent-soft);color:var(--ink);padding:4px 10px;border-radius:999px;font-weight:600}
.flow em{color:var(--muted);font-style:normal}
.pill{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.mcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mcard:hover{border-color:var(--accent)}
.mcard .wkl{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mcard h3{font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h .k{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
ul.clean{margin:0;padding-left:1.1em}
ul.clean li+li{margin-top:4px}
.sum-block{border-top:1px solid var(--line);padding-top:12px}
.sum-block:first-of-type{border-top:0;padding-top:0}
.sum-block h3{color:var(--accent);margin-bottom:6px}
.sum-block p,.sum-block ul{max-width:75ch}
.formula{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.formula b{display:block;font-size:.85rem;margin-bottom:4px}
.formula pre{margin:0;font-family:var(--f-mono);font-size:.86rem;white-space:pre-wrap;overflow-x:auto}
.apk{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.apk b{font-family:var(--f-display)}
.q{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.q+.q{margin-top:10px}
.q p.qt{font-weight:600}
.q label{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:6px;cursor:pointer;margin-top:4px}
.q label:hover{background:var(--bg)}
.q label.right{background:var(--good-soft)} .q label.wrong{background:var(--bad-soft)}
.q .why{font-size:.9rem;color:var(--muted);margin-top:6px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.score{font-family:var(--f-display);font-weight:800;font-size:1.6rem}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:90px;resize:vertical}
.essay{display:flex;flex-direction:column;gap:6px}
.essay+.essay{margin-top:14px}
.essay label{font-weight:600}
.essay .n{color:var(--accent);font-family:var(--f-display);font-weight:800;margin-right:4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.task.done span{color:var(--muted);text-decoration:line-through}
.tgroup h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--sediment);margin:6px 0 4px}
.calc{display:flex;flex-direction:column;gap:8px}
.calc .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.calc label{font-size:.82rem;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:3px}
.out{font-family:var(--f-mono);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tw{overflow-x:auto}
.cell{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;font-size:.82rem}
.c0{background:var(--line);color:var(--muted)} .c1{background:var(--warn-soft);color:var(--warn)} .c2{background:var(--accent-soft);color:var(--accent)} .c3{background:var(--good-soft);color:var(--good)}
.gl dt{font-weight:700;font-family:var(--f-display)} .gl dd{margin:0 0 10px;color:var(--muted)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem}
.subtabs button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.status{font-size:.82rem;color:#a9c4cf}
.hidden{display:none!important}

.figs{display:grid;grid-template-columns:1fr;gap:16px}
figure{margin:0}
.fig svg{width:100%;height:auto;display:block;max-height:340px}
.fig figcaption,.photo figcaption{font-size:.88rem;color:var(--muted);margin-top:6px;max-width:75ch}
.fig figcaption b{color:var(--ink);font-family:var(--f-display);display:block}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.fx{fill:var(--ink);font-family:var(--f-body);font-size:12px}
.fx.fs{font-size:11px;fill:var(--muted)} .fx.fb-t{font-weight:700;font-size:12px} .fx.fk{font-weight:800;font-size:11px;letter-spacing:.08em;fill:var(--accent)}
.fb{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.fw{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.fsl{fill:var(--sediment-soft);stroke:var(--sediment);stroke-width:1.2}
.fz1{fill:var(--bg);stroke:var(--line);stroke-width:1}
.fl{stroke:var(--ink);stroke-width:1.4;fill:none} .fd{stroke-dasharray:4 4;opacity:.7}
.fah{fill:var(--ink)}
.fgrid{fill:none;stroke:var(--line)} .fgl{stroke:var(--line);stroke-width:.8}
.fmk{stroke:var(--sediment);stroke-width:1.2;stroke-dasharray:5 4}
.fc1{stroke:var(--accent);stroke-width:2.4;fill:none} .fc2{stroke:var(--sediment);stroke-width:2.2;fill:none} .fc3{stroke:var(--good);stroke-width:2.4;fill:none}
.fx.fc1t{fill:var(--accent);font-weight:700} .fx.fc2t{fill:var(--sediment);font-weight:700} .fx.fc3t{fill:var(--good);font-weight:700}
.fcol{fill:var(--sediment-soft);stroke:var(--sediment);stroke-width:1.2}
.fpoly{stroke:var(--accent);stroke-width:2;fill:none}
.fdot{fill:var(--good)} .fdot2{fill:var(--sediment)}
.fbub{fill:var(--surface);stroke:var(--accent);stroke-width:1}
.fm1{fill:#3b3f44;stroke:none} .fm2{fill:#d9c49a;stroke:none} .fm3{fill:#9b4a4a;stroke:none} .fm4{fill:#a7a49c;stroke:none}
.fx.fwhite{fill:#fff}
.fbelt{stroke:var(--ink);stroke-width:2.2;fill:none}
.froll{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.foil{fill:#3a3226;stroke:var(--sediment)}
.fdrop-oil{fill:#6b5a3a;stroke:none} .fdrop-w{fill:#7fc4cc;stroke:none}
.fsurf{stroke:var(--sediment);stroke-width:1.2}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
/* login + account */
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:0 10px 30px rgba(19,40,58,.08)}
.login-card .mark{margin-bottom:14px}
.login-card h1{font-family:var(--f-display);font-size:1.35rem;margin:0 0 4px}
.login-card p{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.login-card label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.login-card input{width:100%;font:600 1.15rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.login-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.login-card .btn{width:100%;margin-top:14px;padding:12px}
.login-msg{margin-top:12px;color:var(--bad);background:var(--bad-soft);padding:9px 12px;border-radius:6px;font-size:.9rem}
.login-foot{margin-top:18px;font-size:.82rem;color:var(--muted)}
.acct{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#a9c4cf}
.acct b{color:#fff;font-weight:600}
.acct button{background:transparent;border:1px solid #3b5566;color:#cfe0e8;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.8rem}
.acct button:hover{border-color:#a9c4cf}
</style>

<body>
<section class="login" id="login" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="mark" aria-hidden="true">APK</div>

  </form>
</section>

<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">APK</div><div><b>LMS Training — PAC 1</b><small>PT Alfa Prima Kimia · Liquid-Solids Separation</small></div></div>
  <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  <div class="acct"><span class="status" id="status">Loading…</span><b id="who"></b><button type="button" id="logout" hidden>Sign out</button></div>
</header>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Modules by week"></aside>
  <main id="main"></main>
</div>

<script>
const PAC1 = {"program":{"title":"PAC 1 — Liquid-Solids Separation","subtitle":"Raw water and industrial wastewater treatment","weeks":8,"pass":70,"flow":["Read the module","Technical Lesson (written)","Module quiz (min. 70%)","Field tasks","Sales tasks","Safety","PT review & sign-off"],"roles":[["Trainee","New Sales, Technical Sales or Service Engineer at APK"],["PT (Primary Trainer)","Senior engineer who coaches the trainee daily, reviews written answers and signs off each module"],["Manager","Director or manager who reviews progress and runs the final oral exam"],["HSE PIC","APK's health and safety lead for the weekly safety topics"]]},"modules":[{"id":"m1","week":1,"lessons":"Lessons 1–2","title":"Introduction to Liquid-Solids Separation & Basic Water Chemistry","refs":{"teknis":["1.1 Introduction","1.2 Basic Water Chemistry"],"aplikasi":["1.1 Introduction: MOC survey, system stresses, adding value"]},"figs":["flow","alk"],"photos":[["m1-field-test","Field water testing at a customer site: hardness, alkalinity, conductivity and pH"]],"objectives":["Describe the liquid-solids separation chain from raw water intake to sludge disposal","Tell clarification from softening, and coagulation from flocculation","Split alkalinity into hydroxide, carbonate and bicarbonate from P and M titrations","Convert water analysis results to mg/L as CaCO₃","Run a system survey using the MOC (Mechanical–Operational–Chemical) model"],"summary":[{"h":"The big picture","p":"Liquid-solids separation (LSS) covers pretreatment, raw water clarification, media filtration, lime softening and membranes (UF/MF/NF/RO), then wastewater treatment: primary, secondary (biological), tertiary/advanced, and finally sludge stabilization, thickening and dewatering. Special applications include heavy metals, oily waste, foam, odor and industrial cleaning. Every one of these steps produces sludge, and sludge disposal is a real part of the customer's cost."},{"h":"Water sources and impurities","p":"Surface water (rivers, reservoirs) changes quickly with rain and erosion: turbidity, color, organics, algae. Ground water is steadier but higher in minerals: hardness, iron, manganese, CO₂ and H₂S. The usual targets for removal are suspended solids (silt, clay), metals (Fe, Mn), hardness (Ca, Mg), alkalinity (HCO₃⁻, CO₃²⁻) and natural organics (humic and fulvic acids). Left untreated, they cause corrosion, fouling in low-flow areas and mineral scale at the hottest surfaces."},{"h":"Clarification vs softening; coagulation vs flocculation","list":["Clarification removes suspended solids. Softening reduces the dissolved salts that make up hardness and alkalinity.","Colloidal particles carry a negative surface charge and repel each other. Coagulation neutralizes that charge with a positively charged coagulant and fast mixing.","Flocculation then gathers the small destabilized particles into large flocs that settle fast, usually with a high molecular weight polymer that bridges particles."]},{"h":"Why industry treats wastewater","list":["To meet discharge limits and protect receiving water (in Indonesia: the discharge permit and national/regional effluent standards)","To allow plant expansion, water reuse and product recovery","To reduce shock discharges and toxic or hazardous (B3) waste"]},{"h":"Key wastewater parameters","p":"BOD₅ is the dissolved oxygen bacteria consume to break down organic matter aerobically in 5 days at a set temperature; it measures the strength of the waste. COD measures what can be oxidized chemically and is always equal to or higher than BOD. Treatment usually brings TSS from 300–1000 mg/L down to 30 mg/L or less. Oil and grease block oxygen transfer, ammonia is toxic to fish, and nitrogen and phosphorus feed algae."},{"h":"pH, alkalinity and CO₂","list":["pH = −log[H⁺]. pH shows the balance of H⁺ and OH⁻, not how much acid or base is dissolved. Water with 2000 mg/L TDS can still be pH 7.","Alkalinity is the capacity to neutralize acid: HCO₃⁻, CO₃²⁻ and OH⁻ (plus small amounts from phosphate, silica and ammonia).","P alkalinity is titrated to the phenolphthalein end point (about pH 8.3). M or total alkalinity goes to the methyl orange end point (about pH 4.3).","Below pH 8.3 there is no carbonate. Hydroxide only becomes significant above about pH 10.","The CO₂-to-alkalinity ratio sets the pH. High alkalinity means a strong buffer and easier pH control."]},{"h":"Solubility rules of thumb","list":["Hardness salts become LESS soluble as temperature rises, alkalinity rises and CO₂ falls (inverse solubility).","Sodium salts become more soluble with temperature; sodium deposits usually mean evaporation to dryness.","Silica becomes more soluble as pH rises, but at high pH it reacts with hardness, especially magnesium.","Iron and manganese become less soluble as alkalinity and oxidation potential rise, so removal means oxidation plus pH adjustment."]},{"h":"Redox","p":"Oxidation is the loss of electrons; reduction is the gain. Example: Fe → Fe²⁺ + 2e⁻ (corrosion), with oxygen accepting the electrons. Common oxidants are chlorine/hypochlorite, bromine, ozone, permanganate, hydrogen peroxide and chlorine dioxide. Redox reactions can be slow, so contact time has to be one of the variables in a jar test."},{"h":"Units and conversions","list":["For dilute solutions ppm ≈ mg/L; strictly mg/L = ppm × specific gravity of the solution.","Equivalent weight = molecular weight ÷ valence. CaCO₃: MW 100, EW 50.","mg/L as CaCO₃ = mg/L of the ion × (50 ÷ EW of the ion). Ca²⁺ ×2.5, Mg²⁺ ×4.1, HCO₃⁻ ×0.82, Cl⁻ ×1.41.","Check an analysis: total cations (as CaCO₃ or epm) should roughly equal total anions."]},{"h":"The MOC survey: how APK works in the field","list":["Mechanical: plant drawings, design vs actual, modifications, the chemical feed system and injection points.","Operational: historical operating variability, variability of incoming contaminants, feed problems, operating costs.","Chemical: water sources, water and contaminant chemistry, the current chemical program, seasonal changes (wet/dry season, temperature).","Validate the data with the customer, especially costs. Take photos and samples. Repeat the survey at least once a year.","The end goal is Total Cost of Operation (TCO): the total of chemicals, sludge, energy, downtime and penalties, not the price per kilogram."]}],"formulas":[{"n":"pH","f":"pH = −log[H⁺]  ;  [H⁺][OH⁻] = 10⁻¹⁴ (25 °C)"},{"n":"Alkalinity split (as CaCO₃)","f":"P = 0   → HCO₃⁻ = M\nP < ½M → CO₃²⁻ = 2P ; HCO₃⁻ = M − 2P\nP = ½M → CO₃²⁻ = 2P = M\nP > ½M → OH⁻ = 2P − M ; CO₃²⁻ = 2(M − P)\nP = M   → OH⁻ = M"},{"n":"Convert to CaCO₃","f":"mg/L as CaCO₃ = mg/L of ion × 50 / EW of ion"},{"n":"ppm vs mg/L","f":"mg/L = ppm × SG of solution"}],"example":{"h":"Worked example: alkalinity split","p":"A sample shows P = 20 mg/L and M = 150 mg/L as CaCO₃. Since P is less than half of M (20 < 75): CO₃²⁻ = 2 × 20 = 40 mg/L, HCO₃⁻ = 150 − 40 = 110 mg/L, OH⁻ = 0. P is about 13% of M, so expect a pH around 9.2–9.3."},"apk":"Directly related APK products: NaOH and HCl/H₂SO₄ for pH and alkalinity correction. Understand buffering: an acidic waste is far easier to neutralize smoothly with a buffered base than with straight NaOH, which makes pH jump between 9 and 4.3.","quiz":[{"q":"Water has P alkalinity 0 and M alkalinity 120 mg/L as CaCO₃. The alkalinity is present as…","o":["60 mg/L CO₃²⁻ + 60 mg/L HCO₃⁻","120 mg/L OH⁻","120 mg/L HCO₃⁻","120 mg/L CO₃²⁻"]},{"q":"The phenolphthalein (P alkalinity) end point is around pH…","o":["7.0","8.3","10.0","4.3"]},{"q":"Which statement about pH is TRUE?","o":["pH 6 has 10× more H⁺ than pH 7","High-TDS water always has a high pH","pH does not depend on temperature","pH shows the total amount of acid in water"]},{"q":"The solubility of hardness salts such as CaCO₃ tends to DROP when…","o":["Dissolved CO₂ rises","Temperature and alkalinity rise","Temperature falls","pH falls"]},{"q":"100 mg/L of Ca²⁺ equals how many mg/L as CaCO₃? (EW of Ca = 20)","o":["250","40","500","100"]},{"q":"Removing iron and manganese from well water basically needs…","o":["Oxidation and pH adjustment, then solids separation","Lowering the pH only","Cooling the water","Adding sodium chloride"]},{"q":"In the MOC survey, ‘historical variability of contaminant load’ belongs to…","o":["Commercial","Mechanical","Operational","Chemical"]},{"q":"BOD₅ measures…","o":["Oxygen needed to chemically oxidize all organics","Oxygen bacteria need to break down organics aerobically over 5 days","Oil content","Total suspended solids"]},{"q":"Coagulation is…","o":["Neutralizing the charge on colloids so they can come together","Settling of sludge in a clarifier","Bridging of particles by a high molecular weight polymer","Straining in a sand filter"]},{"q":"The main reason to calculate Total Cost of Operation (TCO) for a customer is to…","o":["Raise the selling price","Compare price per kilogram only","Show the total cost: chemicals, sludge, energy, downtime and penalty risk","Replace all of the customer's equipment"]}],"essays":["Name the two types of water supply and explain why water must be treated before industrial use.","What is the difference between clarification and softening? Between coagulation and flocculation?","Why do industrial plants treat their wastewater? Explain the purpose of primary, secondary and tertiary treatment.","Name the three factors that govern how much gas dissolves in water. Which matters more for water treatment, dissolved nitrogen or dissolved oxygen? Why?","State the four rules of thumb for the solubility of hardness, sodium, silica, and iron/manganese compounds.","What is the H⁺ concentration at pH 8.0? What happens to pH when NaCl is dissolved, and when Na₂CO₃ is dissolved? Explain why.","Water has M alkalinity of 150 mg/L and pH 6.9. Using a CO₂/M ratio of about 0.3, how much CO₂ is dissolved? Give the answer as CaCO₃ and as CO₂.","In 4Fe + 3O₂ → 2Fe₂O₃, what is oxidized and what is reduced?","What are the molecular and equivalent weights of NaCl and CaCO₃? Why are results reported as CaCO₃?","Name the two classes of oily emulsions. What is foam, and what steps are used to develop an antifoam application?"],"tasks":{"lapangan":["Run hardness, P and M alkalinity, conductivity and pH tests at one customer site with your PT","Take one set of customer water analysis data, split the alkalinity and check the cation–anion balance","Join your PT on a short MOC survey at one customer and fill in the M-O-C checklist"],"sales":["Discuss APK's service standards with your PT: response time, routine visits, reports, safety","Discuss customer warning signals with your manager: repeated complaints, contact changes, open tenders, late payments","Study the APK company profile and the product list and data sheets relevant to PAC 1"],"k3":["Make sure your PPE is complete: hard hat, safety glasses, safety shoes, ear plugs, chemical gloves","Read the SDS for NaOH, HCl and NaOCl; summarize the main hazards and first aid","Discuss safe driving to customer sites with your PT"]},"review":"Go through your Lesson 1–2 answers with your PT for about one hour. The PT checks that you can split alkalinity and convert to CaCO₃ without notes."},{"id":"m2","week":2,"lessons":"Lessons 3–5","title":"Basic Calculations, Coagulation–Flocculation & Pretreatment","refs":{"teknis":["1.3 Basic Calculations","1.4 Coagulation and Flocculation","1.5 Pretreatment"],"aplikasi":["1.2 Program Selection","1.3 Bench Testing (jar test)"]},"figs":["coag","jar"],"photos":[["m2-jar-test","Jar test on a four-paddle gang stirrer, after slow mix"],["m2-polymer-makedown","Polymer make-down unit: powder hopper, mixing and aging tanks"],["m2-bar-screen","Mechanical bar screen at the wastewater inlet"]],"objectives":["Calculate detention time, surface rise rate, weir overflow rate, solids loading, chemical usage and cost","Explain double layer theory, zeta potential and streaming current","Choose coagulant and flocculant types and make them down correctly","Calculate the G factor and judge mixing intensity","Run a proper jar test and build a dosage curve","Explain screening, grit removal, comminution and equalization"],"summary":[{"h":"Why the calculations matter","p":"Plant equipment ages, gets modified and is often overloaded. A few simple numbers (DT, SRR, WOR, SL) tell you whether a unit is overloaded or underloaded, which is the basis for any recommendation or proposal. Some of these numbers only mean something as weekly or monthly averages."},{"h":"Particle size and why we coagulate","p":"Fine sand (0.1 mm) settles 1 m in about 2 minutes; silt (10 µm) takes about 108 minutes; bacteria (1 µm) about 180 hours; colloids (0.1 µm) about 755 days. Colloids stay suspended because of their negative surface charge. Without coagulation, practical clarification is impossible."},{"h":"Double layer, zeta potential, streaming current","list":["A particle is surrounded by a fixed (Stern) layer and a diffuse (Gouy) layer. The potential at the shear plane is the zeta potential.","A zeta meter measures how fast and in which direction particles move in an electric field, which tells you the size and sign of the charge.","A streaming current detector (SCD) is used online to control coagulant dose: the closer to neutral, the lower the current."]},{"h":"What affects flocculation","list":["Mixing intensity and time: short and fast for coagulation, long and gentle for flocculation. Too much energy breaks the floc.","Solids concentration: low-turbidity water has fewer collisions and needs more time.","Temperature: cold water is more viscous, settling slows down and chemical demand rises.","Coagulant overdose reverses the particle charge and redisperses the solids."]},{"h":"Inorganic coagulants","list":["Alum (aluminium sulfate): best around pH 5.5–6.5. Each 1 mg/L of alum consumes about 0.5 mg/L of alkalinity as CaCO₃, which 0.39 mg/L of hydrated lime can replace.","PACl (polyaluminium chloride): much smaller pH effect and high activity; good at low dose.","Iron salts (ferric chloride, ferric sulfate, ferrous sulfate): wider pH range; also used to condition sludge.","Bentonite and activated silica add weight and collision opportunities to the floc (activated silica at about 7–11% of the alum dose)."]},{"h":"Organic polymers","list":["Polymer coagulants: cationic, very high charge, MW 50,000–1.5 million (polyamines, polyDADMAC). Usually liquids dosed neat.","Polymer flocculants: MW above 5 million; cationic, anionic or nonionic polyacrylamides. Supplied as powder, emulsion or dispersion and must be made down.","Typical flocculant dose: 0.05–2 mg/L for raw water clarification, 1–200 mg/L for wastewater, depending heavily on the solids.","Polymers vs metal salts: less sludge that dewaters better, no pH or alkalinity drop, no added TDS."]},{"h":"Polymer make-down","list":["Powder: wet it out with fast mixing, then age it with slow mixing so the chains uncoil, then post-dilute before the feed point. Avoid ‘fish eyes’ (undissolved lumps).","Emulsion (latex): must be inverted into water; high energy at the start, short aging.","Lab solutions: flocculant solutions degrade after about 8 hours; make aluminium or iron coagulant solutions fresh every 4 hours."]},{"h":"The jar test: how trials are won","list":["Bring: gang stirrer, fresh product samples (under 6 months old), syringes, stopwatch, graduated cylinder, sample bucket, pH meter, turbidimeter.","Test solutions: coagulants at 1–10%, flocculants at 0.1–0.5% (diluted further to 0.05–0.1% for clarification tests).","Take a chemical-free sample (after any pH or chlorine addition, before the polymer point). Fill four 500 mL beakers; one is the blank or current-program benchmark.","Fast mix at about 200 rpm for 20 seconds to 3 minutes (coagulant at the start, flocculant about 10 seconds before the end), slow mix at 15–40 rpm for 5–20 minutes, then settle 5–30 minutes.","Record: speed and size of pin floc, floc uniformity, settling rate, clarity of the supernatant (turbidity sampled 1 inch / 2.5 cm below the surface).","Test a wide dose range first so you do not stop at a false minimum, then narrow it. Always compare against the program in use.","A jar test only simulates sedimentation. It cannot simulate a sludge blanket or a sand filter. Use water at the actual plant temperature."]},{"h":"Mixing intensity (G factor)","p":"G = √(P / µV). Rapid mix for clarification: 5–20 seconds at G 250–1500 s⁻¹. Flocculation before clarification: 10–30 minutes at G 20–80 s⁻¹. Flocculation before filtration: 2–10 minutes at G 20–100 s⁻¹. Too high a G or Gt breaks the floc. If mixing is weak: change or modify the mixer, move the injection point to a pipe run with bends, or add a static mixer."},{"h":"Pretreatment","list":["Bar racks (15–38 mm openings) protect pumps and downstream equipment; keep approach velocity around 0.46 m/s.","Fine screens (under 16 mm): inclined fixed, rotary drum or disk, centrifugal. Choose by particle size and by what you are protecting (for example membranes).","Comminutors cut coarse solids so they can be treated with the rest (common in municipal plants).","Grit chambers (horizontal flow at about 0.3 m/s, aerated, or vortex) remove sand and gravel so pumps don't wear and digesters don't fill up.","Equalization smooths out flow and concentration peaks (pH, toxics). Many control problems in wastewater plants trace back to an undersized equalization tank."]}],"formulas":[{"n":"Detention time","f":"DT = Volume / Flow\nV rectangular = L × W × D ;  V circular = π r² D"},{"n":"Surface rise rate (SRR)","f":"SRR = Flow / Surface area   (m³/m²·h = m/h)"},{"n":"Weir overflow rate (WOR)","f":"WOR = Flow / Weir length   (typical 125–500 m³/m·day)\nCircular weir length = π × d"},{"n":"Solids loading (SL)","f":"SL = Solids (kg/day) / Surface area (m²)"},{"n":"Product usage","f":"kg/day = Flow (m³/h) × 24 × dose (mg/L) / 1000"},{"n":"Chemical cost","f":"Rp/day = usage (L/day) × SG × price (Rp/kg)"},{"n":"Dilution / jar test dose","f":"V₁ × C₁ × SG₁ = V₂ × C₂ × SG₂\nShortcut: 1 mL of 0.5% solution in 500 mL sample = 10 mg/L"},{"n":"Velocity gradient","f":"G = √( P / (µ × V) )   [s⁻¹]"}],"example":{"h":"Worked example: clarifier and jar test","p":"A circular clarifier is 18 m in diameter and 4 m deep, with 400 m³/h flow. V = π × 9² × 4 = 1,018 m³, so DT = 2.5 h. Area = 254.5 m², so SRR = 1.57 m/h. Jar test: 4 mL of a 0.5% solution in an 800 mL sample gives C₂ = 4 × 5000 / 800 = 25 mg/L. At full scale, 80 mg/L on 45.4 m³/h = 45.4 × 24 × 80 / 1000 = 87.2 kg/day."},"apk":"APK's aluminium sulfate is the classic inorganic coagulant. When you offer alum, always calculate its alkalinity demand (0.5 mg/L per mg/L of alum) and the NaOH needed for pH correction: two products, one solution. Compare its TCO against PACl or polymer as well, especially sludge volume.","quiz":[{"q":"A circular clarifier is 18 m in diameter, 4 m deep, with 400 m³/h flow. Its detention time is about…","o":["4.0 h","1.6 h","0.4 h","2.5 h"]},{"q":"1 mL of a 0.5% (by weight) polymer solution is added to a 500 mL sample. The dose is…","o":["1 mg/L","50 mg/L","10 mg/L","5 mg/L"]},{"q":"A dose of 80 mg/L on 45.4 m³/h needs about how much product per day?","o":["87 kg","36 kg","872 kg","3.6 kg"]},{"q":"Each 1 mg/L of alum consumes natural alkalinity of about…","o":["0.5 mg/L as CaCO₃","None","0.1 mg/L","2 mg/L"]},{"q":"The main difference between a polymer coagulant and a polymer flocculant is…","o":["They are identical","Coagulants have high charge and lower MW (charge neutralization); flocculants have very high MW (bridging)","Coagulants are high MW, flocculants low MW","Flocculants are always cationic"]},{"q":"In a jar test, flocculant is usually added…","o":["After sampling","At the start of fast mix with the coagulant","During settling","About 10 seconds before fast mix ends"]},{"q":"A turbidity–dose curve for an organic coagulant can show a ‘false minimum’. To avoid it…","o":["Test only one dose","Always use the highest dose","Skip the blank","Test a wide dose range first, then narrow it"]},{"q":"Recommended G for flocculation ahead of clarification is…","o":["20–80 s⁻¹","250–1500 s⁻¹","Above 10,000 s⁻¹","1500–7500 s⁻¹"]},{"q":"The main job of an equalization tank is to…","o":["Dry sludge","Settle grit","Kill bacteria","Smooth out flow and concentration (pH, toxics) going to downstream units"]},{"q":"Why should a jar test be benchmarked against the current program?","o":["To make results look good","It is a legal requirement","To calibrate mix and settling times to full-scale performance","It doesn't need to be"]}],"essays":["Calculate the detention time of a circular clarifier 18.3 m in diameter and 4.6 m deep with an average flow of 15,142 m³/day.","Calculate the WOR of a circular clarifier 22.9 m in diameter with a weir diameter of 21.34 m and a flow of 681.6 m³/h.","Calculate the solids loading of a rectangular DAF 25.9 × 13.7 m receiving 77.2 tonnes of solids per day.","Calculate the SVI of a sample with 3,500 mg/L MLSS that settles to 460 mL/L.","Calculate F/M: aeration volume 22,720 m³, MLSS 6,500 mg/L, influent BOD 3,500 mg/L, flow 227 m³/h.","Calculate the solids capture of a press: 6.5% feed solids, 25% cake, 800 mg/L in the filtrate.","Explain double layer theory, zeta potential and streaming current.","List the factors that affect the rate of flocculation and the effect of each.","List the common inorganic coagulants and two major advantages of polymer coagulants.","Explain how mixing intensity, the G factor and retention time relate to each other.","What is pretreatment and why is it needed? Name its four main operations and what each does."],"tasks":{"lapangan":["Tour an industrial wastewater plant and sketch every chemical injection point","Tour a municipal or industrial-estate sewage plant and identify the chemical injection points","Tour a sludge dewatering unit and identify the polymer feed point","Get the SDS of the wastewater polymer the customer is using","Prepare coagulant and flocculant samples and make sure a jar tester (gang stirrer) is available for next week","Inspect the customer's test reagents: are they expired? Do the procedures in the customer program book still match? Are standard reagents used?"],"sales":["Learn how a customer service plan is set up and how service is billed","Attend one business review with a customer; keep the material as a reference","Build a list of 20 PAC 1 prospects (industrial WWTP/WTP) in your future area from industrial estate directories and the APK database","Make 6 cold calls and log every opportunity in your weekly activity report","Review the cold calls with your PT: place each one on the sales pyramid and count its warning signals"],"k3":["Study the confined space entry procedure (wastewater tanks, pits, vessels)","Discuss H₂S and other gas hazards at wastewater plants with the HSE PIC"]},"review":"Your PT checks Lessons 3–5 and the list of 20 prospects. You should be able to work out a jar test dose without notes."},{"id":"m3","week":3,"lessons":"Lessons 6–7","title":"Raw Water Clarification & Clarifier Equipment","refs":{"teknis":["1.6 Raw Water Clarification","1.7 Raw Water Clarification Equipment","1.9 Lime Softening (background reading)"],"aplikasi":["1.4 Clarification","1.6 Cold Lime Softening"]},"figs":["sedzones","solidscontact"],"photos":[["m3-clarifier","Circular solids-contact clarifier at an industrial water treatment plant"],["m3-greensand","Pressure filter vessels for iron and manganese removal"]],"objectives":["Name what clarification removes and the usual quality targets","Compare conventional clarification, direct filtration and membrane filtration","Explain greensand iron and manganese removal (CR and IR processes)","Compare horizontal, sludge blanket and solids-contact (sludge recirculation) clarifiers","Control sludge inventory and troubleshoot carryover"],"summary":[{"h":"What gets removed","list":["Mainly suspended solids (turbidity) and color. Partly iron, manganese, colloidal silica and organics that cause taste and odor.","TDS does NOT go down in clarification; it goes up with alum or iron salts. Chlorination raises chloride.","Adding lime softening also reduces hardness, alkalinity, TDS, some silica and phosphate."]},{"h":"Turbidity and targets","list":["Units: NTU (nephelometer, light scattered at 90°) and FTU (spectrophotometer, light transmitted). Strongly colored water reads higher in FTU.","A river can reach 4,000 NTU in a flood. Drinking water: under 0.5–1 NTU. Industry: under 5 NTU from the settling basin is fine for cooling tower makeup; under 1 NTU after filters.","High turbidity fouls ion exchange resin, causes colloidal fouling of RO membranes and adds silica to boilers.","Particle counters are more sensitive than turbidimeters and give early warning of filter breakthrough."]},{"h":"Color, hardness, stability","list":["Color comes from tannins and lignins and is measured on the APHA (Pt-Co) scale. Water above 30 APHA often gets a 10 APHA target if it feeds a demineralizer or white paper production. Color comes out more easily at low pH (under 6).","Lime softening is impractical below 70 mg/L M alkalinity unless soda ash is added. The ‘Rule of 70’: after softening, calcium plus carbonate cannot exceed 70 mg/L as CaCO₃.","Switching from alum (acidic) to a polymer can raise alkalinity in the boiler feedwater. Always check the downstream effect."]},{"h":"Iron, manganese and greensand","list":["Typical targets: Fe under 0.05 mg/L, Mn under 0.01 mg/L. Iron is oxidized by aeration or chlorine; manganese often needs potassium permanganate.","Greensand CR (continuous regeneration): chlorine plus KMnO₄ is fed ahead of the filter; a faint pink-orange influent means enough permanganate. For iron-dominant water. Backwash at about 55–62 kPa head loss.","Greensand IR (intermittent regeneration): manganese is oxidized directly on the grains; the media is regenerated periodically with KMnO₄. For manganese-dominant water.","Limits: minimum pH 6.2; never let head loss exceed 69 kPa or the media can fracture."]},{"h":"Plant designs","list":["Conventional: rapid mix → flocculation → sedimentation → filters → clear well. Handles the widest range of raw water quality.","Direct filtration: no settling step; only for raw water under 20 NTU and under 40 APHA color. Rapid mix is critical.","Membrane (UF/MF): filtrate around 0.1 NTU and retains pathogens, but does not remove dissolved salts. Side-stream (pressure) or submerged (vacuum) configurations."]},{"h":"Clarifier types","list":["Conventional horizontal/rectangular: rapid mix, flocculation and settling in separate basins, with inlet, settling, sludge and outlet zones. Forgiving but slow to respond.","Sludge blanket (upflow): coagulated water passes up through a suspended sludge layer that acts as a floc filter.","Solids-contact / internal sludge recirculation: part of the settled sludge is returned and mixed with incoming water. More collisions, denser floc, better tolerance of flow changes and higher capacity.","Inclined plate (lamella): a large effective settling area in a small footprint."]},{"h":"Sludge inventory control","list":["In a solids-contact clarifier the sludge inventory is the engine. Measure it with a 5–10 minute settleable solids test (% by volume) from the reaction zone.","Too little sludge: small floc and carryover on flow surges. Too much: the blanket rises and sludge washes over the weirs.","Turbine/agitator speed too high breaks floc; too low lets sludge settle in the reaction zone.","Gas release (cold water warming in an indoor clarifier, or anaerobic sludge hiding in dead corners) floats the floc."]},{"h":"Sludge and economics","p":"Alum and iron sludges are bulky, hydrated and hard to dewater; polymer-coagulant sludges are denser and dewater more easily. In lime softening, 1 kg of lime makes about 2.2 kg of sludge, but it dewaters well. When you trial a program, calculate TCO: chemicals + sludge disposal + pH correction + downstream effects (ion exchange run length, cooling tower cycles, aluminium fouling in heat exchangers)."}],"formulas":[{"n":"Rule of 70 (lime softening)","f":"If Ca + CO₃ (as CaCO₃) > 70:\nreduction of each = (Ca + CO₃ − 70) / 2"},{"n":"Clarifier rise rate","f":"SRR = Q / A   → compare with design (m/h)"}],"example":{"h":"Worked example: Rule of 70","p":"After softening, Ca = 35 and CO₃ = 61 mg/L as CaCO₃ (sum 96, above 70). The excess of 26 is split in two, 13 each. Final Ca = 22 mg/L and final CO₃ = 48 mg/L as CaCO₃."},"apk":"At power plant and industrial WTPs, APK can come in with alum, NaOH for pH correction and NaOCl for prechlorination and iron oxidation. Sell the downstream effect: low turbidity means longer demineralizer and RO runs.","quiz":[{"q":"Raw water clarification usually does NOT reduce…","o":["Colloidal silica","TDS","Turbidity","Color"]},{"q":"Direct filtration suits raw water with…","o":["High hardness","Turbidity under 20 NTU and color under 40 APHA","Turbidity above 100 NTU","High oil"]},{"q":"The greensand CR process is best for water that is…","o":["High in oil","High in silica","Iron-dominant (with or without a little manganese)","Manganese-dominant with no iron"]},{"q":"The visual sign of enough KMnO₄ on a CR greensand filter is…","o":["pH dropping to 4","Foam on the surface","A faint pink-orange tint in the filter influent","Very turbid water"]},{"q":"The advantage of a solids-contact clarifier with sludge recirculation is…","o":["More particle collisions, denser floc, higher capacity and better tolerance of flow changes","No coagulant needed","No sludge produced","No operator needed"]},{"q":"If the sludge inventory in an upflow clarifier is depleted…","o":["Nothing changes","Water gets clearer","Floc is small and carries over on load surges","Chemical use drops"]},{"q":"Settled water turbidity that is usually good enough for cooling tower makeup is…","o":["Under 0.1 NTU","Under 500 NTU","Under 50 NTU","Under 5 NTU"]},{"q":"In a lime softener, 1 kg of lime produces about…","o":["1 kg of sludge","2.2 kg of sludge","0.2 kg of sludge","10 kg of sludge"]},{"q":"Floating floc in an indoor clarifier on cold raw water is usually caused by…","o":["Dissolved gas coming out as the water warms","pH too high","Alum overdose","Too little chlorine"]},{"q":"Replacing alum with a polymer coagulant can affect the boiler because…","o":["Silica rises sharply","Hardness rises","There is no effect","Feedwater alkalinity may rise since alum no longer consumes it"]}],"essays":["List the common contaminants in natural water sources that may need to be removed in raw water clarification.","Name the two main clarification plant designs. What is the advantage of one over the other? What is the main advantage of membrane filtration?","Name the two main turbidity units and explain how the three main instruments for measuring turbidity work (nephelometer, spectrophotometer, visual comparator).","Explain how greensand removes iron and manganese, and outline the CR and IR processes.","Compare the sludge produced with iron or aluminium coagulants versus polymer coagulants. How can the sludge be handled?","Compare an upflow sludge recirculating clarifier with a conventional horizontal clarifier. Which is better for rapid flow changes? For high flow rates?","Compare a sludge blanket clarifier and an upflow sludge recirculating clarifier. How are they similar and how do they differ?","What is the purpose of the rapid mix zone and of the flocculation zone?","Sketch a rectangular settling tank, label its zones, and draw the path of a particle entering at two-thirds of the inlet height.","How is sludge controlled in an upflow clarifier? What does raising the agitator speed do to the sludge blanket concentration?"],"tasks":{"lapangan":["Calculate the rise rate of two different clarifiers this week and compare with design","Visit a plant that uses a polymer feeder or dosing unit; note its settings and problems","Install a portable dosing pump at a customer plant together with your PT","Survey one clarifier or wastewater opportunity using the MOC checklist","Get equipment and solutions ready for next week's jar tests"],"sales":["Place one order through APK's order system and track it until delivery","Complete your weekly activity report and send it to your PT and the admin","Collect an example customer program book for a PAC 1 application from another engineer","Build your PAC 1 sales toolbox: APK profile, data sheets and SDS for alum, NaOH and NaOCl, application photos"],"k3":["Study APK's safe jar testing practice (concentrated chemicals, wastewater samples)","Your manager does a ‘commentary drive’ (driving evaluation) with you"]},"review":"Your PT and manager meet with you to assess technical progress at the halfway point."},{"id":"m4","week":4,"lessons":"Lessons 8–9","title":"Filtration & Primary Wastewater Treatment","refs":{"teknis":["1.8 Filtration","1.10 Primary Wastewater Treatment"],"aplikasi":["1.5 Filtration","1.7 Primary Wastewater Treatment"]},"figs":["filter","daf"],"photos":[["m4-sand-filter-backwash","Gravity sand filter during backwash"],["m4-daf-float","DAF unit with the float layer being skimmed"],["m4-api-separator","API oil-water separator at a refinery"]],"objectives":["Explain how granular media filters capture particles and the bed types (single, dual, multimedia)","Calculate filtration rate and understand the run, backwash and ripening cycle","Describe the four types of settling and the four zones of a settling basin","Explain oil-water separators (API, CPI/PPI) and DAF versus IAF","Calculate DAF hydraulic loading and air-to-solids ratio"],"summary":[{"h":"How filtration works","list":["Particles are captured through the depth of the bed, not just at the surface: first transport (sedimentation, interception, diffusion), then attachment.","Floc from the clarifier that is too large plugs the surface and head loss rises fast. Floc that is too small or weak passes through (breakthrough).","A filter aid (low-dose polymer) strengthens attachment and lengthens the run. Filter conditioning doses polymer into the backwash or the start of the run to shorten the ripening period."]},{"h":"Bed types and equipment","list":["Single media (sand), dual media (anthracite over sand), multimedia (anthracite, sand, garnet): coarse to fine in the direction of flow for deeper penetration and longer runs.","Rapid sand gravity filters, pressure filters (vertical or horizontal; saves repumping, common in industry), upflow filters.","Conventional rapid sand filtration rate is about 5–7.5 m³/m²·h; high-rate and multimedia filters can run 12–24 m³/m²·h.","Backwash: water only, water with surface wash, water with air scour, or combinations. Trigger backwash on head loss, effluent turbidity, or time/volume."]},{"h":"Four types of settling","list":["Type 1, discrete: particles settle individually (grit chamber).","Type 2, flocculent: particles combine as they settle (primary clarifier, chemical clarification).","Type 3, zone or hindered: particles settle together as a blanket (secondary clarifier).","Type 4, compression: sludge compacts at the bottom (thickener, clarifier floor)."]},{"h":"Primary clarifiers","list":["A physical step for settleable solids; municipal plants remove 40–60% of solids here. Detention time is usually 1–2 hours.","Typical design loading is 32.6–48.9 m³/m²·day. Lower means good removal but unused capacity; higher means carryover.","Detention time above 2 hours turns sludge septic: gas, odor and floating sludge.","Prevent short-circuiting with good inlet distribution, baffles, level weirs and steady flow.","Tube and plate settlers multiply the effective settling area. Avoid them for oily, greasy or sticky solids, which plug them."]},{"h":"Oil-water separators","list":["API separator: a long channel sized on the rise velocity of oil droplets (about 150 µm and larger), with surface skimmers.","CPI/PPI: corrugated or parallel inclined plates shorten the rise distance, giving a small footprint and capture of smaller droplets (about 60 µm).","Emulsified oil cannot be separated by gravity; it needs chemicals plus flotation."]},{"h":"DAF and IAF","list":["DAF: part of the effluent (recycle) is saturated with air under pressure and released into the tank. Micro-bubbles attach to the floc and lift it; the float is skimmed off.","Key parameters: hydraulic loading (including recycle), solids loading, air-to-solids ratio (A/S about 0.02–0.06), coagulant and flocculant dose, saturation pressure.","IAF/DGF: larger bubbles made mechanically (impeller or eductor) with short retention. Common in refineries and oilfields for produced water."]}],"formulas":[{"n":"Filtration rate","f":"Filtration rate = Flow / Filter area   (m³/m²·h)"},{"n":"DAF hydraulic loading","f":"HLR = (Q influent + Q recycle) / Surface area"},{"n":"Air-to-solids ratio","f":"A/S = mass of air released / mass of influent solids"}],"example":{"h":"Worked example: DAF","p":"A DAF is 3.66 m in diameter with 34.08 m³/h influent and 50% recycle. Total flow = 51.1 m³/h. Area = π × 1.83² = 10.5 m², so HLR = 4.86 m/h. At 4.57 m deep the volume is 48 m³, giving about 56 minutes retention. If the influent rises to 45.4 m³/h (recycle still 50%), HLR goes to about 6.5 m/h: shorter retention and lower A/S, so check air and polymer."},"apk":"At industrial wastewater plants with DAF or API units, APK's openings are coagulants (alum, ferric chloride), pH control (NaOH, H₂SO₄) and polymers. Always survey the DAF's mechanical condition (recycle pump, saturation pressure) before blaming the chemistry.","quiz":[{"q":"Clarifier floc that is too small or weak reaching a filter causes…","o":["Breakthrough (particles in the effluent)","Longer filter runs","Fast head loss at the surface","No effect"]},{"q":"In a multimedia filter, the media order from top to bottom is…","o":["Garnet, sand, anthracite","Carbon, garnet, sand","Anthracite, sand, garnet","Sand, anthracite, garnet"]},{"q":"Activated sludge settling in a secondary clarifier is which type?","o":["Zone/hindered","Discrete","It doesn't settle","Flocculent"]},{"q":"Primary clarifier detention time above 2 hours risks…","o":["Ever higher efficiency","Septic sludge, gas, odor and floating sludge","No risk","pH rising to 12"]},{"q":"Tube settlers should NOT be recommended for…","o":["Alum clarification","Clean raw water","Oily or greasy waste and sticky solids","Well water"]},{"q":"The essential difference between DAF and IAF is…","o":["DAF is only for drinking water","IAF uses no air","No difference","DAF uses micro-bubbles from pressurized dissolved air; IAF uses larger, mechanically made bubbles"]},{"q":"A 3.66 m DAF with 34 m³/h influent and 50% recycle has an HLR of about…","o":["1.6 m/h","9.7 m/h","3.2 m/h","4.9 m/h"]},{"q":"Filter conditioning is used to…","o":["Stop backwashing","Replace the media","Shorten the ripening period after backwash","Add media depth"]},{"q":"An API separator is effective for…","o":["Free oil (large droplets) and settleable solids","Fine emulsified oil","Dissolved metals","Soluble BOD"]}],"essays":["Explain how floc leaving a clarifier that is too large or too small causes problems in a filter.","What advantages does a pressure filter have over other filter types? What can a filter aid program offer your customer?","Describe the particle transport mechanisms in filtration and the components of a conventional rapid sand filter.","What is filter conditioning? Sketch a vertical pressure filter and label its main components.","Describe single, dual and multimedia beds: media type, arrangement, size and depth. Name the four backwash systems.","Give the formula for filtration rate and the typical range for conventional rapid sand filters.","Describe the four types of settling and where each occurs; name the four zones of a settling basin.","Which parameters are most critical to prevent short-circuiting in a primary clarifier?","A clarifier is designed for 32.6–48.9 m³/m²·day. What happens if the flow is lower? Higher?","Describe how a DAF works and sketch it. When would you choose an IAF instead?"],"tasks":{"lapangan":["Tour a wastewater plant with secondary (biological) treatment; note its units and parameters","Tour an RO plant in your area; note its pretreatment","Run hardness, alkalinity, conductivity and pH tests at two locations; check whether calcium and magnesium cycles agree","Make sure jar test solutions and equipment are ready for next week"],"sales":["Start the customer program book for the PAC 1 proposal you will make in weeks 7–8","Get an example PAC 1 proposal from another engineer or the APK archive","Send 10 introduction letters or emails to prospects","Make at least 4 cold calls focused on WWTP/WTP opportunities","With the admin, compare bulk vs small-pack pricing for coagulants and flocculants"],"k3":["Learn how to store chemical samples and ship water and deposit samples safely","Discuss with the HSE PIC any cases of improperly shipped samples"]},"review":"Your PT reviews Lessons 8–9 and your proposal plan. Expense and activity reports must be up to date."},{"id":"m5","week":5,"lessons":"Lessons 10–11","title":"Secondary (Biological) & Tertiary Wastewater Treatment","refs":{"teknis":["1.11 Secondary Wastewater Treatment","1.12 Tertiary Wastewater Treatment"],"aplikasi":["1.8 Secondary Wastewater Treatment (troubleshooting)","1.9 Tertiary Wastewater Treatment"]},"figs":["as"],"photos":[["m5-aeration-basin","Aeration basin of an activated sludge plant"],["m5-settleometer","30-minute settling test (settleometer) for SVI"],["m5-microscope","Illustration of activated sludge under the microscope: floc, stalked ciliates, rotifers"]],"objectives":["Describe activated sludge, trickling filters, RBCs, ponds/lagoons, MBR and anaerobic systems","Calculate and interpret F/M, SVI, MLSS, MCRT and WAS","Read biomass health: oxygen uptake, nutrients, indicator organisms","Diagnose common problems: bulking, pin floc, foaming, rising sludge","Explain tertiary goals: chlorination/dechlorination, ammonia, phosphate, solids, organics"],"summary":[{"h":"What secondary treatment does","list":["Biologically oxidizes the soluble organics left after primary treatment (BOD/COD) into CO₂, water and new biomass.","Captures and settles suspended solids carried over from primary treatment and the biomass it grows.","Removes nutrients biologically (nitrification/denitrification, biological phosphorus) when designed to."]},{"h":"Types of biological systems","list":["Activated sludge (aeration basin + secondary clarifier + RAS/WAS): the most common.","Trickling filters and RBCs (attached growth / biofilm) followed by a secondary clarifier.","Stabilization ponds and aerated lagoons: simple but need a lot of land.","MBR: UF/MF membranes do the solids separation; no secondary clarifier, high MLSS, excellent effluent.","Anaerobic systems (UASB, digesters) for high-COD waste; they produce biogas."]},{"h":"Activated sludge control parameters","list":["F/M = kg BOD in per day ÷ kg MLSS under aeration. Conventional about 0.2–0.5; extended aeration about 0.05–0.15.","SVI = 30-minute settled volume (mL/L) × 1000 ÷ MLSS (mg/L). Normal is about 100–150 mL/g; above 150–200 suggests bulking.","MCRT (sludge age) = mass of solids in the system ÷ solids leaving per day (WAS plus effluent).","Aeration DO is usually held at about 1–3 mg/L. Nutrients: BOD : N : P ≈ 100 : 5 : 1.","Oxygen uptake rate (OUR): flat or zero means dead or poisoned biomass; low means light load or inhibition, and effluent will suffer."]},{"h":"Microbial growth phases","list":["Log growth: excess food, maximum growth, poor dispersed floc.","Declining growth: food becomes limited and floc starts to form well.","Endogenous: very little food; bacteria consume their own reserves. Less sludge, but floc can break up (pin floc) if taken too far."]},{"h":"Indicator organisms","list":["Bacteria (heterotrophs, nitrifiers) do the main work of oxidation and floc formation.","Protozoa: stalked and free-swimming ciliates dominating means a healthy, stable system; flagellates and amoebae dominating means high load or young sludge.","Rotifers and nematodes indicate old sludge.","Excess filaments cause bulking (high SVI, sludge that won't compact). Nocardia or Microthrix cause thick brown foam."]},{"h":"Quick troubleshooting","list":["Filamentous bulking: check low DO, F/M too low or too high, nutrient deficiency, septicity, pH. Fix the root cause; short-term, chlorinate the RAS or add cationic polymer at the clarifier.","Pin floc / turbid effluent: sludge too old, toxicity, or too much turbulence.","Rising sludge in the clarifier: denitrification (N₂ bubbles). Reduce sludge residence time in the clarifier.","White foam (start-up or high F/M) versus thick brown foam (Nocardia filaments, old sludge).","Always talk to the operator: they often see, hear or smell a problem first. Safety comes first."]},{"h":"Tertiary treatment","list":["Common goals: disinfection, removing remaining solids, ammonia, phosphate, refractory organics and color, and meeting discharge or reuse limits.","Chlorination followed by dechlorination (SO₂ or bisulfite) so residual chlorine doesn't harm the receiving water.","Breakpoint chlorination for ammonia needs about 7.6 mg Cl₂ per mg NH₃-N and produces acid (pH control needed, e.g. NaOH). It is expensive and mostly replaced by biological nitrification.","Phosphate: precipitation with alum or iron salts (AlPO₄, FePO₄), lime precipitation, or biological removal (EBPR).","Remaining solids: sand or multimedia filters, UF/MF. Organics: activated carbon, oxidation."]}],"formulas":[{"n":"F/M","f":"F/M = (Q × BOD × 24 / 1000) / (V aeration × MLSS / 1000)\n[Q m³/h, BOD & MLSS mg/L, V m³ → kg/kg·day]"},{"n":"SVI","f":"SVI = (30-min settled volume, mL/L × 1000) / MLSS (mg/L)"},{"n":"MCRT (sludge age)","f":"MCRT = (kg MLSS aeration + kg solids clarifier) / (kg WAS/day + kg effluent TSS/day)"},{"n":"WAS for a target MCRT","f":"WAS (kg/day) = (MLSS aeration + MLSS clarifier) / target MCRT − effluent TSS"},{"n":"Phosphate (alum/iron)","f":"Al³⁺ + PO₄³⁻ → AlPO₄↓   ;   Fe³⁺ + PO₄³⁻ → FePO₄↓"}],"example":{"h":"Worked example: F/M and SVI","p":"Aeration volume 14,200 m³, MLSS 4,000 mg/L, influent BOD 2,000 mg/L, flow 113.6 m³/h. BOD load = 113.6 × 24 × 2000 / 1000 = 5,453 kg/day. MLSS mass = 14,200 × 4000 / 1000 = 56,800 kg. F/M = 0.096, a lightly loaded system. SVI: 350 mL/L settled with MLSS 3,200 mg/L gives 109 mL/g, which is normal."},"apk":"APK's NaOCl fits effluent disinfection and RAS chlorination during bulking; NaOH compensates alkalinity lost in nitrification; alum removes phosphate. When you offer them, tie the dose to a measured parameter: chlorine residual, total P, pH.","quiz":[{"q":"SVI of a sample settling to 350 mL/L with MLSS of 3,200 mg/L is…","o":["109 mL/g","350 mL/g","1,094 mL/g","11 mL/g"]},{"q":"An SVI above 200 mL/g usually indicates…","o":["DO too high","Bulking (sludge that settles poorly)","No problem","Very dense sludge"]},{"q":"The classic nutrient ratio for activated sludge (BOD : N : P) is…","o":["100 : 5 : 1","100 : 1 : 5","1 : 1 : 1","10 : 5 : 1"]},{"q":"A flat (zero) oxygen uptake rate means…","o":["Dead or poisoned biomass","A very healthy system","Very high BOD load","The DO meter must be broken"]},{"q":"Stalked ciliates dominating the activated sludge usually means…","o":["Anaerobic conditions","Start-up or overload","Toxicity","A healthy, stable system"]},{"q":"Clumps of sludge with bubbles rising in a secondary clarifier are usually caused by…","o":["pH too low","Denitrification (N₂ gas) because sludge stays too long in the clarifier","Polymer overdose","Phosphate shortage"]},{"q":"Why is breakpoint chlorination for ammonia rarely used today?","o":["It needs a lot of chlorine (about 7.6 mg per mg NH₃-N), produces acid and is costly; biological nitrification replaced it","It doesn't work","It is banned outright","It produces sludge"]},{"q":"F/M with a BOD load of 5,453 kg/day and MLSS mass of 56,800 kg is…","o":["0.01","10.4","0.96","0.096"]},{"q":"The advantage of an MBR over conventional activated sludge is…","o":["No secondary clarifier, higher MLSS, better effluent, smaller footprint","No aeration needed","Lower energy use","No sludge at all"]}],"essays":["A DO meter is used to monitor an activated sludge system. What is a normal oxygen uptake for a healthy system? What does a flat (zero) uptake mean? What problems follow a low uptake, and what can cause it?","What is the F/M ratio, how is it determined, and what are the main nutrient needs of activated sludge?","Describe the three growth phases of microorganisms. How does excess food affect growth? Compare the declining and endogenous phases.","List the microorganisms that matter in biological oxidation. Which are most important and why?","Discuss sludge production in the two common biological processes. Sketch how microorganisms use organic carbon.","Why is tertiary treatment often required? What are its six most common goals?","Why may chlorination and dechlorination be needed? If gaseous chlorine is used to remove ammonia, why may pH control be needed and which chemical would you use?","Explain breakpoint chlorination. Why is it rarely used and what replaced it?","Name the three main ways to remove phosphate and write the reactions for the first two."],"tasks":{"lapangan":["Tour a sludge dewatering application with a senior PAC 1 application engineer","Run jar tests at two prospects this week; document with photos and data","Document the customer's cost of operating sludge dewatering (polymer, power, cake disposal) on the APK survey form","Run a 30-minute SVI test and observe an activated sludge sample (color, odor, floc) at one plant","Restock your field test kit"],"sales":["Make 4 sales calls, alone or with another engineer","Use a pre-call plan to follow up two earlier cold calls: have their warning signals changed?","Build a sales pyramid for the accounts in your future area","Discuss your jar test results with your PT or a senior engineer; discuss with your manager how to make jar test preparation faster"],"k3":["Discuss this quarter's safety program with the HSE PIC","Learn the biological hazards at wastewater plants (pathogens) and hygiene after sampling"]},"review":"Your PT reviews Lessons 10–11 and the jar test data from the two prospects."},{"id":"m6","week":6,"lessons":"Lessons 12–13","title":"Heavy Metal Removal & Advanced Wastewater Treatment","refs":{"teknis":["1.13 Heavy Metals Removal","1.14 Advanced Wastewater Treatment"],"aplikasi":["1.10 Heavy Metal Removal","1.11 Advanced Wastewater Treatment"]},"figs":["metals"],"photos":[["m6-metal-finishing-wwt","Batch treatment tanks at a metal finishing wastewater plant with pH/ORP controllers"],["m6-filter-press-cake","Metal hydroxide cake discharging from a filter press"]],"objectives":["Explain why heavy metals must be removed, where they come from, and how limits are set","Understand ligands, chelants, the solubility product (Ksp) and ionic strength","Choose a precipitation method (hydroxide, sulfide, carbonate, organosulfur) and compare them","Explain chromate reduction and two-stage cyanide destruction","Compare ED/EDR, membranes, and chemical/UV oxidation in advanced treatment"],"summary":[{"h":"Why and where from","list":["Heavy metals are toxic to aquatic life and people, accumulate, and inhibit biological treatment.","Limits are set as a concentration (mg/L) and/or a load (kg per tonne of product).","Sources: electroplating and metal finishing, PCB/electronics, batteries, leather tanning (Cr), textiles and dyes, mining and smelting, power plants (FGD), refineries.","Common metals: Cr, Cu, Ni, Zn, Pb, Cd, Hg, As."]},{"h":"Metal chemistry in water","list":["A ligand is a molecule or ion that bonds to a metal ion (NH₃, CN⁻, Cl⁻, OH⁻, EDTA, citrate). The coordination number is how many ligand bonds the metal ion forms.","Chelants (EDTA, citrate, tartrate, amines) lock metals in solution, so hydroxide precipitation fails. You need a stronger precipitant or to break the complex.","Ksp: the smaller it is, the less soluble the compound. Metal sulfides are far less soluble than hydroxides.","High ionic strength (TDS) raises effective solubility, so recycling water inside the plant makes metal removal harder."]},{"h":"Three stages of treatment","list":["1) Pretreatment: equalization, Cr⁶⁺ reduction, cyanide destruction, breaking chelates.","2) Metal precipitation: adjust pH and/or add a precipitant.","3) Solids-liquid separation: coagulation–flocculation, clarifier or DAF, filters, filter press."]},{"h":"Precipitation methods","list":["Hydroxide (NaOH, lime, Mg(OH)₂): the most common and cheapest. Each metal has its own minimum-solubility pH, and amphoteric metals redissolve if pH goes too high. Bulky sludge; fails with chelants.","Sulfide (Na₂S, NaHS, FeS): very low residuals and less affected by chelants; risk of H₂S and odor, fine particles.","Carbonate (soda ash): good for Pb and Cd; denser sludge.","Organosulfur precipitants (dithiocarbamate, DTC): bind metals even from complexes, form floc fast at small doses; ideal as a polishing step after hydroxide.","Cementation: a noble metal is plated out by a more active one (e.g. Cu²⁺ + Fe → Cu + Fe²⁺)."]},{"h":"Chromate reduction and cyanide destruction","list":["Cr⁶⁺ → Cr³⁺ with bisulfite, metabisulfite or SO₂ (or ferrous sulfate) at acidic pH of about 2–3 (H₂SO₄), controlled by ORP. Cr³⁺ is then precipitated as Cr(OH)₃ at about pH 8–9.","Cyanide by two-stage alkaline chlorination: stage 1 oxidizes CN⁻ to cyanate (CNO⁻) with NaOCl at pH 10 or higher; stage 2 oxidizes cyanate to CO₂ and N₂ at about pH 8–8.5. NEVER chlorinate cyanide at low pH: it releases toxic CNCl/HCN gas.","Alternatives: hydrogen peroxide, ozone, or SO₂/air."]},{"h":"Other methods and advanced treatment","list":["Membranes (RO, NF, UF with complexing polymers, ED/EDR) and electrolytic recovery suit high concentrations or recovery of valuable metals.","ED/EDR moves ions through membranes with an electric current; economical only at low to moderate TDS and often beaten on cost by RO/NF.","Chemical oxidation for refractory organics, color, cyanide and sulfide: chlorine, ClO₂, ozone, H₂O₂ (with iron = Fenton), KMnO₄, UV/AOP. Weigh by-products (chlorinated organics), cost and safety.","UV leaves no chemical residual and works for disinfection and AOP, but turbidity, color and lamp fouling reduce it."]}],"formulas":[{"n":"Solubility product","f":"MₐXᵦ ⇌ aM + bX   ;   Ksp = [M]ᵃ[X]ᵇ"},{"n":"Chromate reduction (bisulfite)","f":"2H₂CrO₄ + 3NaHSO₃ + 3H₂SO₄ → Cr₂(SO₄)₃ + 3NaHSO₄ + 5H₂O"},{"n":"Cyanide stages 1 and 2","f":"CN⁻ + OCl⁻ → CNO⁻ + Cl⁻   (pH ≥ 10)\n2CNO⁻ + 3OCl⁻ + H₂O → 2CO₂ + N₂ + 3Cl⁻ + 2OH⁻   (pH ≈ 8–8.5)"}],"example":{"h":"Troubleshooting logic","p":"A plating plant complains of high nickel in the effluent even at pH 9.5. Ask: is there a chelant (EDTA or citrate from electroless baths)? If so, hydroxide alone won't do it. Segregate the electroless stream, add an organosulfur or sulfide polishing step, and run jar tests to set the dose and the flocculant."},"apk":"APK's product chain in metal finishing: H₂SO₄/HCl for the acidic pH in Cr⁶⁺ reduction, NaOH for hydroxide precipitation and neutralization, NaOCl for cyanide destruction. Always offer jar testing and pH/ORP control. This is a high-risk application, not just a chemical sale.","quiz":[{"q":"Why does hydroxide precipitation often fail on electroless plating waste?","o":["There is too little oxygen","Chelants (EDTA, citrate) keep the metals dissolved","The temperature is too low","The pH is too high"]},{"q":"Reducing Cr⁶⁺ to Cr³⁺ with bisulfite is done at a pH of about…","o":["10–11","2–3","7","12–13"]},{"q":"Stage 1 cyanide destruction with hypochlorite (CN⁻ → CNO⁻) runs at pH…","o":["6–7","It doesn't matter","4 or lower","10 or higher"]},{"q":"Compared with hydroxide, sulfide precipitation…","o":["Leaves lower residuals and is less affected by chelants, but risks H₂S","Leaves higher metal residuals","Cannot be used","Is always cheaper"]},{"q":"Higher ionic strength (TDS) from recycling plant water tends to…","o":["Make metal removal easier","Lower the pH","Have no effect","Raise the effective solubility of metals, making removal harder"]},{"q":"Cementation is…","o":["Plating out a noble metal with a more active one (e.g. Cu²⁺ with iron)","Membrane filtration","Coagulation with lime","Drying sludge with cement"]},{"q":"Why is ED/EDR often less economical than RO/NF?","o":["Energy cost climbs steeply at high TDS and capacity is limited","It produces no concentrate","It cannot move ions","It needs no power"]},{"q":"The three general stages of heavy metal treatment are…","o":["Digestion, thickening, dewatering","Screening, grit removal, equalization","Pretreatment, precipitation, solids-liquid separation","Aeration, chlorination, filtration"]}],"essays":["Why must heavy metals be removed from wastewater? What are the two main forms of discharge limits? Name six source industries and six common metal pollutants.","What is a ligand (give four examples)? What is the coordination number of a metal ion in a complex?","What is the solubility product constant? What does it mean in plain terms? Write its formula.","What is ionic strength and why does it matter? Why is increasing water recycling inside a plant bad news for metal removal?","What are chelating agents and why do they matter in metal removal? What is a formation constant?","Name and discuss five membrane methods for heavy metal removal, and electrolytic recovery.","Discuss chemical precipitation: why it is preferred, two concerns with it, and the common precipitants with their pros and cons. Explain the role of organosulfur precipitants.","Outline chromate reduction and cyanide destruction (both processes).","Discuss ED and EDR; outline chemical oxidation in AWT and the six common oxidants with their pros and cons; the pros and cons of UV."],"tasks":{"lapangan":["Write a service visit report for the dewatering account you visited last week","Write a service visit report on last week's jar tests","Visit an antifoam application in your area","If possible, join your PT at a metal finishing or plating plant and note the Cr, CN and precipitation sequence"],"sales":["Attend a business review for a liquid-solids separation account","Prepare a 60-question survey of the people and process at the prospect you will propose to","Get a recent PAC 1 proposal and program book from a senior engineer","Discuss with the admin how far ahead you need to start a good program book and proposal","Review territory business planning with your PT","Suggest at least 10 prospects for a customer technical seminar; discuss with your PT why APK runs seminars"],"k3":["Do a vehicle safety inspection with your PT and record it on the inspection form","Read the SDS for sodium bisulfite and the cyanide hazard; learn the emergency procedure"]},"review":"Start preparing the proposal you will present to your manager in weeks 7–8."},{"id":"m7","week":7,"lessons":"Lessons 14–16","title":"Sludge Treatment: Stabilization, Thickening & Dewatering","refs":{"teknis":["1.15 Sludge Stabilization","1.16 Sludge Thickening","1.17 Sludge Dewatering"],"aplikasi":["1.12 Sludge Stabilization","1.13 Sludge Thickening","1.14 Sludge Dewatering"]},"figs":["beltpress"],"photos":[["m7-belt-press","Belt filter press discharging sludge cake"],["m7-centrifuge","Decanter centrifuge in a dewatering building"],["m7-drainage-test","Free drainage test: conditioned sludge poured onto filter cloth"]],"objectives":["Explain the purpose and methods of sludge stabilization (anaerobic, aerobic, chemical/thermal)","Understand SLR, SRT, HRT, HLR and volatile solids reduction","Compare gravity, DAF, rotary drum, gravity belt and centrifugal thickeners","Know the belt filter press, screw press, centrifuge, vacuum filter and filter press","Calculate solids capture and polymer cost per dry tonne"],"summary":[{"h":"Stabilization","list":["Purpose: reduce odor, pathogens and the volume of sludge that needs further processing. Common in municipal and food industry plants.","Anaerobic: mesophilic digesters with 15–30 days detention produce methane. Watch VS loading, VS reduction, alkalinity vs volatile acids, temperature.","Aerobic: simpler, but aeration energy is high. ATAD (auto-heated thermophilic aerobic digestion) uses the reaction heat to reach thermophilic temperatures and low pathogens.","Chemical or thermal: lime (pH above 12), heat.","Coagulants and flocculants in digesters help supernatant separation and downstream thickening and dewatering."]},{"h":"Thickening","list":["Purpose: raise solids concentration (e.g. 1% to 4–6%) so volume drops sharply before digestion or dewatering.","Gravity thickener: zone settling and compression. Parameters: hydraulic loading, solids loading, sludge volume ratio (blanket volume ÷ volume pumped per day), detention time.","DAF thickener: suits light waste activated sludge; the A/S ratio is key.","Rotary drum and gravity belt thickeners need good polymer flocculation (free water release).","Thickener efficiency = solids captured ÷ solids in."]},{"h":"Sludge properties that decide dewatering","list":["Biological vs inorganic fraction: biological sludge (WAS) is hardest; primary and inorganic sludges are easier.","Particle size and bound water, feed solids concentration, oil and grease, sludge age.","Consistent feed is what makes a polymer dose stable."]},{"h":"Belt filter press","list":["Zones: (1) conditioning/polymer flocculation, (2) gravity drainage, (3) wedge/low pressure, (4) high pressure/shear (rollers).","Easy mechanical adjustments: belt speed, belt tension, feed rate, polymer injection point and mixing energy, belt wash spray pressure.","Performance criteria: % cake solids, solids capture (clear filtrate), throughput (kg/h), polymer dose (kg/tonne DS), belt condition (blinding).","Symptoms: cake squeezing out at the belt edges means weak floc, low dose or too much tension; belt blinding means overdose or poor belt washing."]},{"h":"Other dewatering equipment","list":["Centrifuge (solid bowl / decanter): centrifugal force. Variables: bowl speed, scroll differential speed, pond depth, feed rate. Polymer goes in near the feed; the floc must survive shear.","Screw press: gradual pressure along a screen, slow rotation, low energy.","Filter press (plate and frame / recessed chamber): batch, driest cake. Traditionally ferric chloride plus lime (which adds sludge mass); a polymer program cuts mass and corrosion.","Vacuum filter: rotating drum; chemical conditioning is critical.","Drying beds: cheap, but need land and good weather; slow and odorous."]},{"h":"Bench tests for dewatering","list":["Free drainage test: condition the sludge with polymer and pour it onto filter cloth; measure the filtrate volume, how fast it drains and how clear it is.","Vary the dose and type (low to high charge cationic, molecular weight) and the mixing energy (number of pours).","Mix gently and long enough; over-mixing destroys the floc."]}],"formulas":[{"n":"Digester detention time","f":"DT = Digester volume / Sludge flow"},{"n":"Volatile solids reduction","f":"VSR (%) = (VS in − VS out) / VS in × 100"},{"n":"Solids capture","f":"SC (%) = CS × (IS − FS) / [IS × (CS − FS)] × 100\nCS = cake solids, IS = influent solids, FS = filtrate solids (all in %)"},{"n":"Polymer cost","f":"Rp per tonne DS = (kg polymer × Rp/kg) / tonnes of dry solids"}],"example":{"h":"Worked example: solids capture and polymer cost","p":"Feed 5% solids, cake 20%, filtrate 1,000 mg/L (= 0.1%). SC = 20 × (5 − 0.1) / [5 × (20 − 0.1)] × 100 = 98.5%. Cost: 3.79 m³ of 0.5% polymer solution (SG 1.05) = 19.9 kg of product; sludge 189 m³ × 5% × 96% capture = 9.07 tonnes DS, so the dose is 2.19 kg per tonne DS. Multiply by the polymer price for Rp pe
